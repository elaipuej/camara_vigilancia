<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a0f">
<title>Monitor de habitación HD</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
:root{
  color-scheme:dark;
  --bg:#080a0f;
  --panel:#11151d;
  --text:#f4f7fb;
  --muted:#9ba5b4;
  --line:#252c38;
  --accent:#69e6a5;
  --danger:#ff6675;
  --warning:#ffd166
}

*{
  box-sizing:border-box
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

body{
  min-height:100vh
}

#app{
  min-height:100vh;
  display:flex;
  flex-direction:column
}

header{
  min-height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:12px 16px;
  border-bottom:1px solid var(--line);
  background:#080a0f;
  z-index:3
}

h1{
  margin:0;
  font-size:17px
}

.status{
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--muted);
  font-size:12px;
  text-align:right
}

.dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#596273;
  flex:none
}

.dot.live{
  background:var(--accent);
  box-shadow:0 0 12px rgba(105,230,165,.7)
}

.dot.error{
  background:var(--danger)
}

.dot.wait{
  background:var(--warning)
}

main{
  flex:1;
  display:flex;
  flex-direction:column;
  min-height:0
}

.viewer{
  position:relative;
  height:58vh;
  min-height:300px;
  background:#000;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center
}

#video{
  width:100%;
  height:100%;
  object-fit:contain;
  background:#000;
  display:block
}

.placeholder{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
  text-align:center;
  background:radial-gradient(circle at 50% 40%,#171d28,#000 75%)
}

.placeholder.hidden{
  display:none
}

.card{
  max-width:430px
}

.icon{
  font-size:44px;
  margin-bottom:10px
}

.card h2{
  margin:0 0 8px;
  font-size:21px
}

.card p{
  margin:0;
  color:var(--muted);
  line-height:1.5;
  font-size:14px
}

.controls{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  padding:12px 14px;
  background:var(--panel);
  border-top:1px solid var(--line)
}

button{
  flex:1;
  min-width:125px;
  border:0;
  border-radius:12px;
  padding:13px 15px;
  font:inherit;
  font-weight:700;
  cursor:pointer
}

.primary{
  background:var(--accent);
  color:#07130d
}

.secondary{
  background:#1a202b;
  color:var(--text);
  border:1px solid var(--line)
}

#remotePanel{
  padding:14px;
  background:#0d1016;
  border-top:1px solid var(--line)
}

#room{
  width:100%;
  padding:13px;
  margin-bottom:9px;
  border-radius:11px;
  border:1px solid var(--line);
  background:#11151d;
  color:var(--text);
  font:inherit
}

#room:focus{
  outline:none;
  border-color:var(--accent)
}

.info{
  padding:12px 14px;
  background:#0d1016;
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
  word-break:break-word
}

.code{
  color:var(--accent);
  font-weight:700;
  user-select:text
}

.error{
  color:#ff9aa4;
  margin-top:8px
}

#qualityInfo{
  color:var(--accent);
  margin-top:5px
}

#diagnostic{
  max-height:180px;
  overflow:auto;
  padding:10px 14px;
  background:#05070a;
  border-top:1px solid var(--line);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:10px;
  line-height:1.5;
  white-space:pre-wrap;
  word-break:break-word
}

.log-ok{
  color:#69e6a5
}

.log-warn{
  color:#ffd166
}

.log-error{
  color:#ff6675
}

.log-normal{
  color:#aeb7c5
}

.hidden{
  display:none!important
}

@media(max-width:600px){

  .viewer{
    height:52vh;
    min-height:270px
  }

  button{
    min-width:105px
  }

}

@media(orientation:landscape){

  header{
    min-height:52px
  }

  .viewer{
    height:65vh;
    min-height:230px
  }

  #diagnostic{
    display:none
  }

}
</style>
</head>

<body>

<div id="app">

<header>

  <h1>Monitor de habitación HD</h1>

  <div class="status">
    <span id="dot" class="dot"></span>
    <span id="state">Listo</span>
  </div>

</header>

<main>

<section class="viewer">

  <video
    id="video"
    autoplay
    playsinline
    muted
    preload="auto"
  ></video>

  <div id="placeholder" class="placeholder">

    <div class="card">

      <div class="icon">📷</div>

      <h2 id="placeholderTitle">
        Monitor de habitación
      </h2>

      <p id="placeholderText">
        Selecciona el modo que quieres utilizar.
      </p>

    </div>

  </div>

</section>


<!-- MODOS -->

<div class="controls">

  <button
    id="cameraMode"
    class="primary"
  >
    📷 Modo cámara
  </button>

  <button
    id="viewerMode"
    class="secondary"
  >
    👁 Modo visor
  </button>

</div>


<!-- CONTROLES DE CÁMARA -->

<div
  id="cameraControls"
  class="controls hidden"
>

  <button
    id="start"
    class="primary"
  >
    Activar cámara HD
  </button>

  <button
    id="flip"
    class="secondary"
  >
    Cambiar cámara
  </button>

  <button
    id="stop"
    class="secondary"
  >
    Apagar
  </button>

</div>


<!-- VISOR -->

<div
  id="remotePanel"
  class="hidden"
>

  <input
    id="room"
    type="text"
    placeholder="Código de la cámara"
    autocomplete="off"
    autocapitalize="none"
    spellcheck="false"
  >

  <button
    id="connect"
    class="primary"
  >
    Conectar
  </button>

</div>


<!-- INFORMACIÓN -->

<div
  id="info"
  class="info"
>

  <div id="mainInfo">
    Selecciona un modo para comenzar.
  </div>

  <div id="qualityInfo"></div>

  <div
    id="error"
    class="error"
  ></div>

</div>


<!-- DIAGNÓSTICO -->

<div id="diagnostic"></div>

</main>

</div>


<script>

"use strict";


/* =========================================================
   ELEMENTOS
========================================================= */

const video =
  document.getElementById("video");

const placeholder =
  document.getElementById("placeholder");

const placeholderTitle =
  document.getElementById("placeholderTitle");

const placeholderText =
  document.getElementById("placeholderText");

const state =
  document.getElementById("state");

const dot =
  document.getElementById("dot");

const mainInfo =
  document.getElementById("mainInfo");

const qualityInfo =
  document.getElementById("qualityInfo");

const errorBox =
  document.getElementById("error");

const diagnostic =
  document.getElementById("diagnostic");

const remotePanel =
  document.getElementById("remotePanel");

const cameraControls =
  document.getElementById("cameraControls");

const room =
  document.getElementById("room");


/* =========================================================
   VARIABLES
========================================================= */

let peer = null;
let stream = null;
let call = null;
let mode = null;
let rearCamera = true;
let statsTimer = null;


/* =========================================================
   CONFIGURACIÓN DE CALIDAD
========================================================= */

const VIDEO_WIDTH = 1920;
const VIDEO_HEIGHT = 1080;
const VIDEO_FPS = 30;


/* =========================================================
   LOG
========================================================= */

function log(message,type="normal"){

  const line =
    document.createElement("div");

  line.className =
    "log-" + type;

  line.textContent =
    "[" +
    new Date().toLocaleTimeString() +
    "] " +
    message;

  diagnostic.appendChild(line);

  diagnostic.scrollTop =
    diagnostic.scrollHeight;

  console.log(message);

}


function clearLog(){

  diagnostic.innerHTML = "";

}


function setState(text,type="normal"){

  state.textContent = text;

  dot.className = "dot";

  if(type === "live")
    dot.classList.add("live");

  if(type === "wait")
    dot.classList.add("wait");

  if(type === "error")
    dot.classList.add("error");

}


function showPlaceholder(title,text){

  placeholderTitle.textContent =
    title;

  placeholderText.textContent =
    text;

  placeholder.classList.remove("hidden");

}


function hidePlaceholder(){

  placeholder.classList.add("hidden");

}


/* =========================================================
   PEERJS
========================================================= */

function createPeer(){

  if(peer){

    try{
      peer.destroy();
    }catch(e){}

    peer = null;

  }


  log(
    "Creando conexión PeerJS...",
    "normal"
  );


  peer = new Peer({

    debug:2,

    config:{
      iceServers:[
        {
          urls:"stun:stun.l.google.com:19302"
        },
        {
          urls:"stun:stun1.l.google.com:19302"
        }
      ]
    }

  });


  peer.on("open",function(id){

    log(
      "Peer conectado: " + id,
      "ok"
    );


    if(mode === "camera"){

      setState(
        "Cámara lista",
        "live"
      );

      mainInfo.innerHTML =
        "Código de esta cámara:<br>" +
        "<span class='code'>" +
        escapeHtml(id) +
        "</span><br><br>" +
        "Copia este código en el móvil visor.";

    }

  });


  peer.on("call",function(incomingCall){

    log(
      "Llamada recibida.",
      "ok"
    );


    if(mode !== "camera"){

      log(
        "No estoy en modo cámara. Ignorando llamada.",
        "warn"
      );

      return;

    }


    if(!stream){

      log(
        "No existe stream de cámara.",
        "error"
      );

      return;

    }


    call =
      incomingCall;


    setState(
      "Enviando vídeo HD",
      "wait"
    );


    /*
      Enviamos la cámara REAL.
    */

    incomingCall.answer(stream);


    log(
      "Cámara enviada al visor.",
      "ok"
    );


    /*
      Intentamos mejorar las restricciones
      de los sender WebRTC.
    */

    setTimeout(
      optimizeCallQuality,
      1000
    );


    incomingCall.on("close",function(){

      log(
        "Conexión cerrada.",
        "warn"
      );

      call = null;

    });


    incomingCall.on("error",function(e){

      log(
        "Error en llamada: " +
        errorText(e),
        "error"
      );

    });

  });


  peer.on("error",function(e){

    log(
      "Error PeerJS: " +
      errorText(e),
      "error"
    );

    setState(
      "Error",
      "error"
    );

    errorBox.textContent =
      errorText(e);

  });


  peer.on("disconnected",function(){

    log(
      "PeerJS desconectado.",
      "error"
    );

  });

}


/* =========================================================
   CÁMARA HD
========================================================= */

async function startCamera(){

  mode = "camera";

  clearLog();

  errorBox.textContent = "";

  qualityInfo.textContent = "";

  log(
    "=== MODO CÁMARA HD ===",
    "ok"
  );


  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){

    errorBox.textContent =
      "La cámara requiere HTTPS.";

    setState(
      "Cámara no disponible",
      "error"
    );

    return;

  }


  stopConnection();


  showPlaceholder(
    "Activando cámara HD...",
    "Solicitando la máxima resolución disponible."
  );


  setState(
    "Solicitando cámara",
    "wait"
  );


  try{

    /*
      Primero intentamos 1920x1080.
    */

    log(
      "Solicitando 1920x1080 a 30 fps...",
      "normal"
    );


    stream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          width:{
            min:1280,
            ideal:1920,
            max:3840
          },

          height:{
            min:720,
            ideal:1080,
            max:2160
          },

          frameRate:{
            min:24,
            ideal:30,
            max:60
          },

          facingMode:
            rearCamera
              ? {ideal:"environment"}
              : {ideal:"user"},

          resizeMode:"none"
        },

        audio:false

      });


    const track =
      stream.getVideoTracks()[0];


    if(track){

      const settings =
        track.getSettings();

      log(
        "Resolución real: " +
        (settings.width || "?") +
        " x " +
        (settings.height || "?"),
        "ok"
      );

      log(
        "FPS real: " +
        (settings.frameRate || "?"),
        "ok"
      );


      qualityInfo.textContent =
        "Cámara: " +
        (settings.width || "?") +
        "×" +
        (settings.height || "?") +
        " @ " +
        Math.round(settings.frameRate || 0) +
        " fps";


      /*
        Intentamos pedir la máxima calidad
        mediante applyConstraints.
      */

      try{

        await track.applyConstraints({

          width:{
            ideal:1920,
            max:3840
          },

          height:{
            ideal:1080,
            max:2160
          },

          frameRate:{
            ideal:30,
            max:60
          },

          resizeMode:"none"

        });


        const finalSettings =
          track.getSettings();


        log(
          "Resolución después de optimizar: " +
          (finalSettings.width || "?") +
          " x " +
          (finalSettings.height || "?"),
          "ok"
        );


        qualityInfo.textContent =
          "Cámara: " +
          (finalSettings.width || "?") +
          "×" +
          (finalSettings.height || "?") +
          " @ " +
          Math.round(finalSettings.frameRate || 0) +
          " fps";


      }catch(e){

        log(
          "El navegador no permitió ajustar más la cámara.",
          "warn"
        );

      }

    }


    video.srcObject =
      stream;

    video.muted = true;

    await video.play().catch(
      function(){}
    );


    hidePlaceholder();


    setState(
      "Cámara HD activa",
      "live"
    );


    /*
      Crear Peer.
    */

    createPeer();


  }catch(e){

    log(
      "No se pudo abrir la cámara HD: " +
      errorText(e),
      "error"
    );


    /*
      Si 1080p falla, probamos 720p.
    */

    try{

      log(
        "Intentando cámara de respaldo 1280x720...",
        "warn"
      );


      stream =
        await navigator.mediaDevices.getUserMedia({

          video:{
            width:{
              ideal:1280
            },

            height:{
              ideal:720
            },

            frameRate:{
              ideal:30
            },

            facingMode:
              rearCamera
                ? {ideal:"environment"}
                : {ideal:"user"}
          },

          audio:false

        });


      video.srcObject =
        stream;

      hidePlaceholder();

      setState(
        "Cámara HD activa",
        "live"
      );


      const track =
        stream.getVideoTracks()[0];

      if(track){

        const s =
          track.getSettings();

        qualityInfo.textContent =
          "Cámara: " +
          (s.width || "?") +
          "×" +
          (s.height || "?") +
          " @ " +
          Math.round(s.frameRate || 0) +
          " fps";

      }


      createPeer();


    }catch(e2){

      setState(
        "Error de cámara",
        "error"
      );

      errorBox.textContent =
        errorText(e2);

    }

  }

}


/* =========================================================
   OPTIMIZAR WEBRTC
========================================================= */

async function optimizeCallQuality(){

  if(!call){

    return;

  }


  const pc =
    call.peerConnection;


  if(!pc){

    log(
      "RTCPeerConnection todavía no disponible.",
      "warn"
    );

    return;

  }


  log(
    "Optimizando parámetros WebRTC para calidad...",
    "normal"
  );


  const senders =
    pc.getSenders();


  for(const sender of senders){

    if(
      !sender.track ||
      sender.track.kind !== "video"
    ){

      continue;

    }


    try{

      const params =
        sender.getParameters();


      if(!params.encodings ||
         !params.encodings.length){

        params.encodings = [{}];

      }


      const encoding =
        params.encodings[0];


      /*
        Priorizamos calidad.
      */

      encoding.maxBitrate =
        5000000;

      encoding.maxFramerate =
        30;

      encoding.scaleResolutionDownBy =
        1;


      /*
        Mantener una sola capa.
      */

      if("scalabilityMode" in encoding){

        encoding.scalabilityMode =
          "L1T2";

      }


      if("priority" in encoding){

        encoding.priority =
          "high";

      }


      await sender.setParameters(
        params
      );


      log(
        "Parámetros de vídeo WebRTC optimizados.",
        "ok"
      );


    }catch(e){

      log(
        "El navegador no permitió aplicar todos los parámetros: " +
        errorText(e),
        "warn"
      );

    }

  }


  inspectConnection();

}


/* =========================================================
   VISOR
========================================================= */

function startViewer(){

  mode = "viewer";

  clearLog();

  errorBox.textContent = "";

  qualityInfo.textContent = "";

  cameraControls.classList.add(
    "hidden"
  );

  remotePanel.classList.remove(
    "hidden"
  );


  showPlaceholder(
    "Modo visor",
    "Introduce el código del móvil que está en la habitación."
  );


  setState(
    "Esperando código",
    "wait"
  );


  mainInfo.textContent =
    "Escribe el código de la cámara y pulsa Conectar.";


  log(
    "=== MODO VISOR ===",
    "ok"
  );

}


/* =========================================================
   CONECTAR VISOR
========================================================= */

function connectViewer(){

  const id =
    room.value.trim();


  if(!id){

    errorBox.textContent =
      "Introduce el código de la cámara.";

    return;

  }


  clearLog();

  errorBox.textContent = "";

  mode = "viewer";


  log(
    "=== CONECTANDO CON CÁMARA ===",
    "ok"
  );

  log(
    "ID remoto: " + id,
    "normal"
  );


  setState(
    "Conectando...",
    "wait"
  );


  showPlaceholder(
    "Conectando...",
    "Estableciendo conexión de vídeo HD."
  );


  stopConnection();


  /*
    Creamos un stream auxiliar mínimo.
    Es necesario para iniciar la llamada PeerJS.
  */

  const canvas =
    document.createElement("canvas");

  canvas.width = 2;
  canvas.height = 2;


  const ctx =
    canvas.getContext("2d");

  ctx.fillStyle =
    "#000";

  ctx.fillRect(
    0,
    0,
    2,
    2
  );


  const dummyStream =
    canvas.captureStream(1);


  createPeer();


  peer.once("open",function(localId){

    log(
      "Peer visor conectado: " +
      localId,
      "ok"
    );


    log(
      "Enviando solicitud de vídeo...",
      "normal"
    );


    try{

      call =
        peer.call(
          id,
          dummyStream
        );


      if(!call){

        throw new Error(
          "PeerJS no creó la llamada"
        );

      }


      log(
        "MediaConnection creada.",
        "ok"
      );


      setState(
        "Esperando vídeo...",
        "wait"
      );


      /*
        Recibimos la cámara real.
      */

      call.on(
        "stream",
        async function(remoteStream){

          log(
            "================================",
            "ok"
          );

          log(
            "VÍDEO HD RECIBIDO.",
            "ok"
          );

          log(
            "Tracks: " +
            remoteStream.getTracks().length,
            "ok"
          );

          log(
            "================================",
            "ok"
          );


          video.srcObject =
            remoteStream;


          video.muted =
            true;


          video.playsInline =
            true;


          hidePlaceholder();


          setState(
            "Viendo cámara HD",
            "live"
          );


          try{

            await video.play();

          }catch(e){

            log(
              "Play requiere interacción del usuario.",
              "warn"
            );

          }


          /*
            Mostrar resolución real recibida.
          */

          setTimeout(
            updateRemoteQuality,
            500
          );


          inspectConnection();

        }
      );


      call.on(
        "close",
        function(){

          log(
            "La conexión se cerró.",
            "warn"
          );

          setState(
            "Desconectado",
            "error"
          );

          showPlaceholder(
            "Conexión cerrada",
            "El móvil de la habitación dejó de enviar vídeo."
          );

        }
      );


      call.on(
        "error",
        function(e){

          log(
            "ERROR WebRTC: " +
            errorText(e),
            "error"
          );

          setState(
            "Error WebRTC",
            "error"
          );

          errorBox.textContent =
            errorText(e);

        }
      );


    }catch(e){

      log(
        "Error al iniciar llamada: " +
        errorText(e),
        "error"
      );

      setState(
        "Error",
        "error"
      );

      errorBox.textContent =
        errorText(e);

    }

  });

}


/* =========================================================
   CALIDAD REMOTA
========================================================= */

function updateRemoteQuality(){

  if(
    !video.videoWidth ||
    !video.videoHeight
  ){

    return;

  }


  qualityInfo.textContent =
    "Vídeo recibido: " +
    video.videoWidth +
    "×" +
    video.videoHeight;

  log(
    "Resolución recibida: " +
    video.videoWidth +
    "×" +
    video.videoHeight,
    "ok"
  );

}


/* =========================================================
   ESTADO CONEXIÓN
========================================================= */

function inspectConnection(){

  if(!call){

    return;

  }


  const pc =
    call.peerConnection;


  if(!pc){

    return;

  }


  log(
    "WebRTC: " +
    pc.connectionState +
    " | ICE: " +
    pc.iceConnectionState,
    pc.connectionState === "connected"
      ? "ok"
      : "normal"
  );


  if(
    pc.connectionState === "connected"
  ){

    setState(
      mode === "camera"
        ? "Cámara HD conectada"
        : "Viendo cámara HD",
      "live"
    );

  }

}


/* =========================================================
   DETENER CONEXIÓN
========================================================= */

function stopConnection(){

  if(call){

    try{
      call.close();
    }catch(e){}

    call = null;

  }


  if(peer){

    try{
      peer.destroy();
    }catch(e){}

    peer = null;

  }


  if(statsTimer){

    clearInterval(statsTimer);

    statsTimer = null;

  }

}


/* =========================================================
   APAGAR
========================================================= */

function stopAll(){

  stopConnection();


  if(stream){

    stream.getTracks().forEach(
      function(track){

        try{
          track.stop();
        }catch(e){}

      }
    );

    stream = null;

  }


  video.srcObject =
    null;


  setState(
    "Apagado"
  );


  showPlaceholder(
    "Monitor de habitación",
    "Selecciona Modo cámara o Modo visor."
  );


  qualityInfo.textContent = "";

}


/* =========================================================
   BOTONES
========================================================= */

document.getElementById(
  "cameraMode"
).onclick =
function(){

  remotePanel.classList.add(
    "hidden"
  );

  cameraControls.classList.remove(
    "hidden"
  );

  startCamera();

};


document.getElementById(
  "viewerMode"
).onclick =
function(){

  stopAll();

  startViewer();

};


document.getElementById(
  "start"
).onclick =
function(){

  startCamera();

};


document.getElementById(
  "stop"
).onclick =
function(){

  stopAll();

};


document.getElementById(
  "flip"
).onclick =
function(){

  rearCamera =
    !rearCamera;

  if(mode === "camera"){

    startCamera();

  }

};


document.getElementById(
  "connect"
).onclick =
function(){

  connectViewer();

};


room.addEventListener(
  "keydown",
  function(e){

    if(e.key === "Enter"){

      connectViewer();

    }

  }
);


/* =========================================================
   PANTALLA COMPLETA
========================================================= */

document.addEventListener(
  "dblclick",
  async function(){

    try{

      if(!document.fullscreenElement){

        await document.documentElement.requestFullscreen();

      }

    }catch(e){}

  }
);


/* =========================================================
   UTILIDADES
========================================================= */

function errorText(e){

  if(!e){
    return "Error desconocido";
  }

  if(typeof e === "string"){
    return e;
  }

  return (
    e.name
      ? e.name + ": "
      : ""
  ) +
  (
    e.message ||
    e.type ||
    "Error desconocido"
  );

}


function escapeHtml(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   INICIO
========================================================= */

setState(
  "Listo"
);

showPlaceholder(

);

log(
  "Monitor HD cargado.",
  "ok"
);

log(
  "Objetivo: 1920×1080 @ 30 fps.",
  "normal"
);
