<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a0f">

<title>Monitor de habitación - Diagnóstico</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
:root{
  color-scheme:dark;
  --bg:#080a0f;
  --panel:#11151d;
  --text:#f4f7fb;
  --muted:#9ba5b4;
  --line:#252c38;
  --accent:#69e6a5;
  --danger:#ff6675;
  --warning:#ffd166;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  min-height:100vh;
}

#app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

header{
  min-height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:12px 16px;
  border-bottom:1px solid var(--line);
  background:#080a0f;
}

h1{
  margin:0;
  font-size:17px;
}

.status{
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--muted);
  font-size:12px;
  text-align:right;
}

.dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#596273;
  flex:none;
}

.dot.live{
  background:var(--accent);
  box-shadow:0 0 12px rgba(105,230,165,.7);
}

.dot.error{
  background:var(--danger);
}

.dot.wait{
  background:var(--warning);
}

main{
  flex:1;
  display:flex;
  flex-direction:column;
  min-height:0;
}

.viewer{
  position:relative;
  height:48vh;
  min-height:280px;
  background:#000;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

#video{
  width:100%;
  height:100%;
  object-fit:cover;
  background:#000;
}

.placeholder{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
  text-align:center;
  background:radial-gradient(circle at 50% 40%,#171d28,#000 75%);
}

.placeholder.hidden{
  display:none;
}

.card{
  max-width:420px;
}

.icon{
  font-size:44px;
  margin-bottom:10px;
}

.card h2{
  margin:0 0 8px;
  font-size:21px;
}

.card p{
  margin:0;
  color:var(--muted);
  line-height:1.5;
  font-size:14px;
}

.controls{
  display:flex;
  gap:9px;
  flex-wrap:wrap;
  padding:12px 14px;
  background:var(--panel);
  border-top:1px solid var(--line);
}

button{
  flex:1;
  min-width:130px;
  border:0;
  border-radius:12px;
  padding:13px 15px;
  font:inherit;
  font-weight:700;
  cursor:pointer;
}

.primary{
  background:var(--accent);
  color:#07130d;
}

.secondary{
  background:#1a202b;
  color:var(--text);
  border:1px solid var(--line);
}

#remotePanel{
  padding:14px;
  background:#0d1016;
  border-top:1px solid var(--line);
}

#room{
  width:100%;
  padding:13px;
  margin-bottom:9px;
  border-radius:11px;
  border:1px solid var(--line);
  background:#11151d;
  color:var(--text);
  font:inherit;
}

#room:focus{
  outline:none;
  border-color:var(--accent);
}

.info{
  padding:12px 14px;
  background:#0d1016;
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
  word-break:break-word;
}

.code{
  color:var(--accent);
  font-weight:700;
  user-select:text;
}

.error{
  color:#ff9aa4;
  margin-top:8px;
}

#diagnostic{
  max-height:230px;
  overflow:auto;
  padding:12px 14px;
  background:#05070a;
  border-top:1px solid var(--line);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:11px;
  line-height:1.55;
  white-space:pre-wrap;
  word-break:break-word;
}

.log-ok{
  color:#69e6a5;
}

.log-warn{
  color:#ffd166;
}

.log-error{
  color:#ff6675;
}

.log-normal{
  color:#aeb7c5;
}

.hidden{
  display:none!important;
}

@media(max-width:600px){

  .viewer{
    height:43vh;
    min-height:260px;
  }

  button{
    min-width:110px;
  }

}
</style>
</head>

<body>

<div id="app">

<header>

  <h1>Monitor de habitación</h1>

  <div class="status">
    <span id="dot" class="dot"></span>
    <span id="state">Iniciando</span>
  </div>

</header>

<main>

<section class="viewer">

  <video
    id="video"
    autoplay
    playsinline
    muted
  ></video>

  <div id="placeholder" class="placeholder">

    <div class="card">

      <div class="icon">📷</div>

      <h2 id="placeholderTitle">
        Monitor de habitación
      </h2>

      <p id="placeholderText">
        Elige si este móvil será la cámara o el visor.
      </p>

    </div>

  </div>

</section>


<!-- BOTONES PRINCIPALES -->

<div class="controls">

  <button
    id="cameraMode"
    class="primary"
  >
    📷 Modo cámara
  </button>

  <button
    id="viewerMode"
    class="secondary"
  >
    👁 Modo visor
  </button>

</div>


<!-- CONTROLES CÁMARA -->

<div
  id="cameraControls"
  class="controls"
>

  <button
    id="start"
    class="primary"
  >
    Activar cámara
  </button>

  <button
    id="flip"
    class="secondary"
  >
    Cambiar cámara
  </button>

  <button
    id="stop"
    class="secondary"
  >
    Apagar
  </button>

</div>


<!-- CONTROLES VISOR -->

<div
  id="remotePanel"
  class="hidden"
>

  <input
    id="room"
    type="text"
    placeholder="Pega aquí el código de la cámara"
    autocomplete="off"
    autocapitalize="none"
    spellcheck="false"
  >

  <button
    id="connect"
    class="primary"
  >
    Conectar con cámara
  </button>

</div>


<!-- INFORMACIÓN -->

<div
  id="info"
  class="info"
>
  Selecciona un modo.
</div>


<!-- DIAGNÓSTICO -->

<div id="diagnostic"></div>

</main>

</div>


<script>

"use strict";


/* =========================================================
   ELEMENTOS
========================================================= */

const video =
  document.getElementById("video");

const placeholder =
  document.getElementById("placeholder");

const placeholderTitle =
  document.getElementById("placeholderTitle");

const placeholderText =
  document.getElementById("placeholderText");

const state =
  document.getElementById("state");

const dot =
  document.getElementById("dot");

const info =
  document.getElementById("info");

const diagnostic =
  document.getElementById("diagnostic");

const remotePanel =
  document.getElementById("remotePanel");

const cameraControls =
  document.getElementById("cameraControls");

const room =
  document.getElementById("room");

const errorBox =
  document.createElement("div");

errorBox.className = "error";

info.appendChild(errorBox);


/* =========================================================
   VARIABLES
========================================================= */

let peer = null;
let stream = null;
let call = null;

let mode = null;
let rearCamera = true;

let connectionTimer = null;


/* =========================================================
   DIAGNÓSTICO
========================================================= */

function log(message,type="normal"){

  const line =
    document.createElement("div");

  line.className =
    "log-" + type;

  const time =
    new Date().toLocaleTimeString();

  line.textContent =
    "[" + time + "] " + message;

  diagnostic.appendChild(line);

  diagnostic.scrollTop =
    diagnostic.scrollHeight;

  console.log(message);

}


function clearLog(){

  diagnostic.innerHTML = "";

}


function setState(text,type="normal"){

  state.textContent = text;

  dot.className = "dot";

  if(type === "live"){
    dot.classList.add("live");
  }

  if(type === "error"){
    dot.classList.add("error");
  }

  if(type === "wait"){
    dot.classList.add("wait");
  }

}


function setInfo(text){

  info.innerHTML = text;

  info.appendChild(errorBox);

}


function error(message){

  errorBox.textContent =
    message || "";

}


/* =========================================================
   PLACEHOLDER
========================================================= */

function showPlaceholder(title,text){

  placeholderTitle.textContent =
    title;

  placeholderText.textContent =
    text;

  placeholder.classList.remove("hidden");

}


function hidePlaceholder(){

  placeholder.classList.add("hidden");

}


/* =========================================================
   CREAR PEER
========================================================= */

function createPeer(){

  log(
    "Creando conexión con PeerJS...",
    "normal"
  );

  setState(
    "Conectando servidor",
    "wait"
  );

  peer = new Peer({

    debug:3,

    config:{
      iceServers:[
        {
          urls:"stun:stun.l.google.com:19302"
        },
        {
          urls:"stun:stun1.l.google.com:19302"
        }
      ]
    }

  });


  peer.on("open",function(id){

    log(
      "PEER OK. ID: " + id,
      "ok"
    );

    setState(
      "Peer conectado",
      "live"
    );

    if(mode === "camera"){

      setInfo(
        "Código de esta cámara:<br>" +
        "<span class='code'>" +
        escapeHtml(id) +
        "</span><br><br>" +
        "Introduce este código en el otro móvil."
      );

    }

  });


  peer.on("call",function(incomingCall){

    log(
      "LLAMADA RECIBIDA desde: " +
      incomingCall.peer,
      "ok"
    );

    if(mode !== "camera"){

      log(
        "Ignorando llamada porque este móvil no está en modo cámara.",
        "warn"
      );

      return;
    }

    if(!stream){

      log(
        "ERROR: llegó una llamada pero no hay cámara activa.",
        "error"
      );

      return;
    }


    call = incomingCall;

    setState(
      "Llamada recibida",
      "wait"
    );

    log(
      "Contestando llamada con la cámara...",
      "normal"
    );


    /*
      IMPORTANTE:
      El stream es opcional al contestar.
      Aquí sí enviamos nuestra cámara real.
    */

    incomingCall.answer(stream);


    log(
      "call.answer(stream) ejecutado.",
      "ok"
    );


    incomingCall.on("stream",function(remoteStream){

      log(
        "Stream remoto recibido en cámara.",
        "ok"
      );

    });


    incomingCall.on("close",function(){

      log(
        "La llamada se cerró.",
        "warn"
      );

      call = null;

    });


    incomingCall.on("error",function(e){

      log(
        "ERROR en MediaConnection: " +
        getErrorText(e),
        "error"
      );

    });

  });


  peer.on("disconnected",function(){

    log(
      "PeerJS se desconectó del servidor.",
      "error"
    );

    setState(
      "Servidor desconectado",
      "error"
    );

  });


  peer.on("close",function(){

    log(
      "PeerJS cerrado.",
      "warn"
    );

  });


  peer.on("error",function(e){

    log(
      "ERROR PEERJS: " +
      getErrorText(e) +
      " | tipo=" +
      (e.type || "desconocido"),
      "error"
    );

    setState(
      "Error PeerJS",
      "error"
    );

    error(
      "PeerJS: " +
      getErrorText(e)
    );

  });

}


/* =========================================================
   CÁMARA
========================================================= */

async function startCamera(){

  mode = "camera";

  clearLog();

  error("");

  log(
    "=== INICIO MODO CÁMARA ===",
    "ok"
  );

  setState(
    "Solicitando cámara",
    "wait"
  );

  showPlaceholder(
    "Activando cámara...",
    "Acepta el permiso de cámara si aparece."
  );


  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){

    log(
      "getUserMedia NO disponible.",
      "error"
    );

    error(
      "Tu navegador no permite cámara aquí. Usa HTTPS."
    );

    setState(
      "Cámara no disponible",
      "error"
    );

    return;
  }


  stopPeerOnly();


  try{

    log(
      "Solicitando getUserMedia...",
      "normal"
    );

    stream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:
            rearCamera
              ? {ideal:"environment"}
              : {ideal:"user"},

          width:{
            ideal:1280
          },

          height:{
            ideal:720
          }
        },

        audio:false

      });


    log(
      "CÁMARA OBTENIDA CORRECTAMENTE.",
      "ok"
    );


    video.srcObject =
      stream;

    hidePlaceholder();


    const tracks =
      stream.getVideoTracks();

    log(
      "Tracks de vídeo: " +
      tracks.length,
      "ok"
    );


    if(tracks.length){

      log(
        "Cámara: " +
        tracks[0].label,
        "ok"
      );

    }


    createPeer();


  }catch(e){

    log(
      "ERROR getUserMedia: " +
      getErrorText(e),
      "error"
    );

    setState(
      "Error cámara",
      "error"
    );

    error(
      getErrorText(e)
    );

  }

}


/* =========================================================
   VISOR
========================================================= */

function startViewer(){

  mode = "viewer";

  clearLog();

  error("");

  setState(
    "Preparando visor",
    "wait"
  );

  showPlaceholder(
    "Modo visor",
    "Introduce el código del móvil que está en la habitación."
  );

  remotePanel.classList.remove("hidden");

  cameraControls.classList.add("hidden");

  log(
    "=== INICIO MODO VISOR ===",
    "ok"
  );

  log(
    "Introduce el ID de la cámara y pulsa CONECTAR.",
    "normal"
  );

}


/* =========================================================
   CONECTAR VISOR
========================================================= */

function connectViewer(){

  const id =
    room.value.trim();


  if(!id){

    error(
      "Introduce el código de la cámara."
    );

    return;
  }


  clearLog();

  error("");

  log(
    "=== INICIANDO CONEXIÓN ===",
    "ok"
  );

  log(
    "ID remoto: " + id,
    "normal"
  );


  setState(
    "Conectando...",
    "wait"
  );

  showPlaceholder(
    "Conectando...",
    "Esperando respuesta del móvil de la habitación."
  );


  stopPeerOnly();


  /*
    Creamos una pista local mínima.
    peer.call necesita un MediaStream.
  */

  const canvas =
    document.createElement("canvas");

  canvas.width = 2;
  canvas.height = 2;

  const ctx =
    canvas.getContext("2d");

  ctx.fillStyle = "black";
  ctx.fillRect(0,0,2,2);


  const dummyStream =
    canvas.captureStream(1);


  log(
    "Stream auxiliar creado para iniciar la llamada.",
    "ok"
  );


  createPeer();


  /*
    Esperamos a que nuestro Peer tenga ID.
  */

  peer.once("open",function(localId){

    log(
      "VISOR PEER OK. ID local: " +
      localId,
      "ok"
    );

    log(
      "Ejecutando peer.call(" +
      id +
      ", stream)...",
      "normal"
    );


    try{

      call =
        peer.call(
          id,
          dummyStream
        );


      if(!call){

        log(
          "ERROR: peer.call() devolvió null.",
          "error"
        );

        setState(
          "Error llamada",
          "error"
        );

        return;
      }


      log(
        "MediaConnection creada.",
        "ok"
      );

      setState(
        "Llamada enviada",
        "wait"
      );


      /*
        Stream de vídeo de la cámara remota.
      */

      call.on("stream",function(remoteStream){

        log(
          "================================",
          "ok"
        );

        log(
          "VÍDEO REMOTO RECIBIDO.",
          "ok"
        );

        log(
          "Tracks remotos: " +
          remoteStream.getTracks().length,
          "ok"
        );

        log(
          "================================",
          "ok"
        );


        video.srcObject =
          remoteStream;


        hidePlaceholder();


        setState(
          "Viendo cámara",
          "live"
        );


        video.play().catch(function(e){

          log(
            "El navegador no inició play automáticamente: " +
            getErrorText(e),
            "warn"
          );

        });


        /*
          Comprobamos la conexión RTCPeerConnection.
        */

        setTimeout(function(){

          inspectPeerConnection();

        },500);

      });


      call.on("close",function(){

        log(
          "La llamada se cerró.",
          "warn"
        );

        setState(
          "Conexión cerrada",
          "error"
        );

        showPlaceholder(
          "Conexión cerrada",
          "El móvil de la habitación cerró la conexión."
        );

      });


      call.on("error",function(e){

        log(
          "ERROR MediaConnection: " +
          getErrorText(e),
          "error"
        );

        setState(
          "Error WebRTC",
          "error"
        );

        error(
          "Error WebRTC: " +
          getErrorText(e)
        );

      });


      /*
        Esperamos unos segundos para saber
        si la conexión WebRTC realmente progresa.
      */

      clearTimeout(connectionTimer);

      connectionTimer =
        setTimeout(function(){

          inspectPeerConnection();

        },10000);


    }catch(e){

      log(
        "EXCEPCIÓN en peer.call(): " +
        getErrorText(e),
        "error"
      );

      setState(
        "Error llamada",
        "error"
      );

    }

  });

}


/* =========================================================
   INSPECCIÓN WEBRTC
========================================================= */

function inspectPeerConnection(){

  if(!call){

    log(
      "No existe MediaConnection para inspeccionar.",
      "warn"
    );

    return;
  }


  const pc =
    call.peerConnection;


  if(!pc){

    log(
      "PeerJS todavía no expone RTCPeerConnection.",
      "warn"
    );

    return;
  }


  log(
    "----- ESTADO WEBRTC -----",
    "normal"
  );

  log(
    "connectionState: " +
    pc.connectionState,
    pc.connectionState === "connected"
      ? "ok"
      : "normal"
  );

  log(
    "iceConnectionState: " +
    pc.iceConnectionState,
    pc.iceConnectionState === "connected" ||
    pc.iceConnectionState === "completed"
      ? "ok"
      : "normal"
  );

  log(
    "signalingState: " +
    pc.signalingState,
    "normal"
  );

  log(
    "-------------------------",
    "normal"
  );


  /*
    Si después de 15 segundos sigue
    en checking, probablemente es NAT/TURN.
  */

  if(
    pc.iceConnectionState === "checking"
  ){

    log(
      "ICE sigue en CHECKING. Puede ser un problema de NAT y requerir TURN.",
      "warn"
    );

  }

}


/* =========================================================
   DETENER PEER
========================================================= */

function stopPeerOnly(){

  if(call){

    try{
      call.close();
    }catch(e){}

    call = null;
  }


  if(peer){

    try{
      peer.destroy();
    }catch(e){}

    peer = null;
  }


  clearTimeout(connectionTimer);

}


/* =========================================================
   APAGAR TODO
========================================================= */

function stopAll(){

  stopPeerOnly();


  if(stream){

    stream.getTracks().forEach(function(track){

      try{
        track.stop();
      }catch(e){}

    });

    stream = null;

  }


  video.srcObject = null;

  setState(
    "Apagado"
  );

  showPlaceholder(
    "Monitor de habitación",
    "Selecciona Modo cámara o Modo visor."
  );

}


/* =========================================================
   CAMBIAR CÁMARA
========================================================= */

document.getElementById("flip").onclick =
function(){

  rearCamera =
    !rearCamera;

  if(mode === "camera"){

    startCamera();

  }

};


/* =========================================================
   BOTÓN ACTIVAR
========================================================= */

document.getElementById("start").onclick =
function(){

  startCamera();

};


/* =========================================================
   BOTÓN APAGAR
========================================================= */

document.getElementById("stop").onclick =
function(){

  stopAll();

};


/* =========================================================
   MODO CÁMARA
========================================================= */

document.getElementById("cameraMode").onclick =
function(){

  remotePanel.classList.add("hidden");

  cameraControls.classList.remove("hidden");

  startCamera();

};


/* =========================================================
   MODO VISOR
========================================================= */

document.getElementById("viewerMode").onclick =
function(){

  stopAll();

  remotePanel.classList.remove("hidden");

  cameraControls.classList.add("hidden");

  startViewer();

};


/* =========================================================
   CONECTAR
========================================================= */

document.getElementById("connect").onclick =
function(){

  connectViewer();

};


/* =========================================================
   ENTER
========================================================= */

room.addEventListener(
  "keydown",
  function(e){

    if(e.key === "Enter"){

      connectViewer();

    }

  }
);


/* =========================================================
   FULLSCREEN
========================================================= */

document.getElementById("fullscreen")?.addEventListener(
  "click",
  async function(){

    try{

      if(!document.fullscreenElement){

        await document.documentElement.requestFullscreen();

      }else{

        await document.exitFullscreen();

      }

    }catch(e){}

  }
);


/* =========================================================
   UTILIDAD ERROR
========================================================= */

function getErrorText(e){

  if(!e){
    return "Error desconocido";
  }

  if(typeof e === "string"){
    return e;
  }

  return (
    e.name
      ? e.name + ": "
      : ""
  ) +
  (
    e.message ||
    e.type ||
    "Error desconocido"
  );

}


function escapeHtml(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   INICIO
========================================================= */

setState(
  "Listo"
);

showPlaceholder(
  "Monitor de habitación",
  "Selecciona «Modo cámara» en el móvil que se quedará en la habitación o «Modo visor» en el móvil desde el que quieres mirar."
