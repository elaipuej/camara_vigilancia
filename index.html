<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a0f">

<title>Monitor de habitación</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
:root{
  color-scheme:dark;
  --bg:#080a0f;
  --panel:#11151d;
  --panel2:#0d1016;
  --text:#f4f7fb;
  --muted:#9ba5b4;
  --line:#252c38;
  --accent:#69e6a5;
  --danger:#ff6675;
  --warning:#ffd166;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

body{
  min-height:100vh;
}

#app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

header{
  height:60px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:0 15px;
  background:#080a0f;
  border-bottom:1px solid var(--line);
}

h1{
  margin:0;
  font-size:17px;
  font-weight:700;
}

.status{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-size:12px;
}

.dot{
  width:8px;
  height:8px;
  flex:none;
  border-radius:50%;
  background:#596273;
}

.dot.live{
  background:var(--accent);
  box-shadow:0 0 12px rgba(105,230,165,.65);
}

.dot.wait{
  background:var(--warning);
}

.dot.error{
  background:var(--danger);
}

main{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
}

.viewer{
  position:relative;
  flex:1;
  min-height:300px;
  background:#000;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

#video{
  display:block;
  width:100%;
  height:100%;
  background:#000;

  /*
    contain evita recortar la imagen.
  */
  object-fit:contain;

  /*
    Evita filtros o transformaciones
    que puedan consumir recursos.
  */
  transform:none;
}

.placeholder{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
  text-align:center;
  background:
    radial-gradient(
      circle at 50% 40%,
      #171d28,
      #000 75%
    );
}

.placeholder.hidden{
  display:none;
}

.card{
  max-width:410px;
}

.card-icon{
  font-size:42px;
  margin-bottom:10px;
}

.card h2{
  margin:0 0 8px;
  font-size:21px;
}

.card p{
  margin:0;
  color:var(--muted);
  line-height:1.5;
  font-size:14px;
}

.controls{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  padding:10px 12px;
  background:var(--panel);
  border-top:1px solid var(--line);
}

button{
  flex:1;
  min-width:115px;
  border:0;
  border-radius:11px;
  padding:12px 14px;
  font:inherit;
  font-weight:700;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

.primary{
  background:var(--accent);
  color:#07130d;
}

.secondary{
  background:#1a202b;
  color:var(--text);
  border:1px solid var(--line);
}

#remotePanel{
  padding:12px;
  background:var(--panel2);
  border-top:1px solid var(--line);
}

#room{
  display:block;
  width:100%;
  padding:12px;
  margin:0 0 8px;
  border:1px solid var(--line);
  border-radius:10px;
  outline:none;
  background:#11151d;
  color:var(--text);
  font:inherit;
}

#room:focus{
  border-color:var(--accent);
}

.info{
  padding:9px 12px;
  background:var(--panel2);
  color:var(--muted);
  font-size:11px;
  line-height:1.5;
  text-align:center;
}

#quality{
  color:var(--accent);
  font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    monospace;
}

#error{
  color:#ff9aa4;
  margin-top:4px;
}

#diagnostic{
  display:none;
  max-height:150px;
  overflow:auto;
  padding:8px 12px;
  background:#05070a;
  border-top:1px solid var(--line);
  font-family:
    ui-monospace,
    SFMono-Regular,
    Menlo,
    monospace;
  font-size:10px;
  line-height:1.4;
  white-space:pre-wrap;
}

.hidden{
  display:none!important;
}

@media(max-width:600px){

  header{
    height:56px;
  }

  .viewer{
    min-height:260px;
  }

  button{
    min-width:100px;
  }

}

@media(orientation:landscape){

  header{
    height:48px;
  }

  .viewer{
    min-height:220px;
  }

}
</style>
</head>

<body>

<div id="app">

<header>

  <h1>Monitor de habitación</h1>

  <div class="status">
    <span id="dot" class="dot"></span>
    <span id="state">Listo</span>
  </div>

</header>


<main>

<section class="viewer">

  <video
    id="video"
    autoplay
    playsinline
    muted
    preload="auto">
  </video>

  <div id="placeholder" class="placeholder">

    <div class="card">

      <div class="card-icon">📷</div>

      <h2 id="placeholderTitle">
        Monitor de habitación
      </h2>

      <p id="placeholderText">
        Selecciona el modo cámara o el modo visor.
      </p>

    </div>

  </div>

</section>


<!-- MODOS -->

<div class="controls">

  <button
    id="cameraMode"
    class="primary">
    📷 Modo cámara
  </button>

  <button
    id="viewerMode"
    class="secondary">
    👁 Modo visor
  </button>

</div>


<!-- CONTROLES CÁMARA -->

<div
  id="cameraControls"
  class="controls hidden">

  <button
    id="start"
    class="primary">
    Activar cámara
  </button>

  <button
    id="flip"
    class="secondary">
    Cambiar cámara
  </button>

  <button
    id="stop"
    class="secondary">
    Apagar
  </button>

</div>


<!-- PANEL VISOR -->

<div
  id="remotePanel"
  class="hidden">

  <input
    id="room"
    type="text"
    placeholder="Código de la cámara"
    autocomplete="off"
    autocapitalize="none"
    spellcheck="false">

  <button
    id="connect"
    class="primary">
    Conectar
  </button>

</div>


<!-- INFORMACIÓN -->

<div class="info">

  <div id="mainInfo">
    Selecciona un modo para comenzar.
  </div>

  <div id="quality"></div>

  <div id="error"></div>

</div>


<div id="diagnostic"></div>

</main>

</div>


<script>

"use strict";


/* =========================================================
   CONFIGURACIÓN DE BAJA LATENCIA
========================================================= */

/*
  720p es mucho más ligero que 1080p y normalmente
  ofrece una conexión bastante más estable en móviles.

  Si la red es buena, 720p/30 puede verse muy bien
  para vigilancia de una habitación.
*/

const CAMERA_WIDTH = 1280;
const CAMERA_HEIGHT = 720;
const CAMERA_FPS = 30;

/*
  2.5 Mbps es un punto de partida razonable para 720p.
*/
const MAX_BITRATE = 2500000;


/* =========================================================
   ELEMENTOS
========================================================= */

const video =
  document.getElementById("video");

const placeholder =
  document.getElementById("placeholder");

const placeholderTitle =
  document.getElementById("placeholderTitle");

const placeholderText =
  document.getElementById("placeholderText");

const state =
  document.getElementById("state");

const dot =
  document.getElementById("dot");

const mainInfo =
  document.getElementById("mainInfo");

const quality =
  document.getElementById("quality");

const errorBox =
  document.getElementById("error");

const diagnostic =
  document.getElementById("diagnostic");

const remotePanel =
  document.getElementById("remotePanel");

const cameraControls =
  document.getElementById("cameraControls");

const room =
  document.getElementById("room");


/* =========================================================
   VARIABLES
========================================================= */

let peer = null;
let stream = null;
let activeCall = null;

let mode = null;

let rearCamera = true;

let statsTimer = null;

let lastBytesReceived = 0;
let lastStatsTime = 0;


/* =========================================================
   ESTADO
========================================================= */

function setState(text,type="normal"){

  state.textContent = text;

  dot.className = "dot";

  if(type === "live"){
    dot.classList.add("live");
  }

  if(type === "wait"){
    dot.classList.add("wait");
  }

  if(type === "error"){
    dot.classList.add("error");
  }

}


function showPlaceholder(title,text){

  placeholderTitle.textContent = title;

  placeholderText.textContent = text;

  placeholder.classList.remove(
    "hidden"
  );

}


function hidePlaceholder(){

  placeholder.classList.add(
    "hidden"
  );

}


function errorText(error){

  if(!error){
    return "Error desconocido";
  }

  if(typeof error === "string"){
    return error;
  }

  return (
    error.name
      ? error.name + ": "
      : ""
  ) +
  (
    error.message ||
    error.type ||
    "Error desconocido"
  );

}


/* =========================================================
   DIAGNÓSTICO
========================================================= */

function log(message){

  const line =
    document.createElement("div");

  line.textContent =
    "[" +
    new Date().toLocaleTimeString() +
    "] " +
    message;

  diagnostic.appendChild(line);

  diagnostic.scrollTop =
    diagnostic.scrollHeight;

  console.log(message);

}


/* =========================================================
   CREAR PEER
========================================================= */

function createPeer(){

  if(peer){

    try{
      peer.destroy();
    }catch(e){}

    peer = null;

  }


  peer = new Peer({

    debug:1,

    config:{
      iceServers:[
        {
          urls:"stun:stun.l.google.com:19302"
        },
        {
          urls:"stun:stun1.l.google.com:19302"
        }
      ]
    }

  });


  peer.on(
    "open",
    function(id){

      log(
        "Peer conectado: " + id
      );


      if(mode === "camera"){

        setState(
          "Cámara lista",
          "live"
        );


        mainInfo.innerHTML =
          "Código de cámara:<br>" +
          "<strong>" +
          id +
          "</strong><br>" +
          "Introduce este código en el móvil visor.";

      }

    }
  );


  peer.on(
    "call",
    function(incomingCall){

      log(
        "Llamada recibida."
      );


      if(mode !== "camera"){

        log(
          "No estoy en modo cámara."
        );

        return;

      }


      if(!stream){

        log(
          "No hay stream de cámara."
        );

        return;

      }


      activeCall =
        incomingCall;


      setState(
        "Enviando vídeo",
        "wait"
      );


      /*
        Enviar el stream real.
      */

      incomingCall.answer(
        stream
      );


      /*
        Esperamos a que WebRTC cree
        el RTCPeerConnection.
      */

      setTimeout(
        optimizeSender,
        1000
      );


      incomingCall.on(
        "close",
        function(){

          log(
            "Visor desconectado."
          );

          activeCall = null;

          setState(
            "Cámara lista",
            "live"
          );

        }
      );


      incomingCall.on(
        "error",
        function(error){

          log(
            "Error de llamada: " +
            errorText(error)
          );

        }
      );

    }
  );


  peer.on(
    "error",
    function(error){

      log(
        "Error PeerJS: " +
        errorText(error)
      );

      setState(
        "Error",
        "error"
      );

      errorBox.textContent =
        errorText(error);

    }
  );


  peer.on(
    "disconnected",
    function(){

      log(
        "Peer desconectado."
      );

    }
  );

}


/* =========================================================
   CÁMARA
========================================================= */

async function startCamera(){

  mode = "camera";

  errorBox.textContent = "";

  quality.textContent = "";

  stopConnection();

  showPlaceholder(
    "Activando cámara...",
    "Configurando vídeo 720p de baja latencia."
  );

  setState(
    "Activando cámara",
    "wait"
  );


  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){

    errorBox.textContent =
      "Este navegador no permite acceder a la cámara. Utiliza HTTPS.";

    setState(
      "Cámara no disponible",
      "error"
    );

    return;

  }


  try{

    log(
      "Solicitando 1280×720 @ 30 FPS."
    );


    stream =
      await navigator.mediaDevices.getUserMedia({

        video:{

          width:{
            ideal:CAMERA_WIDTH
          },

          height:{
            ideal:CAMERA_HEIGHT
          },

          frameRate:{
            ideal:CAMERA_FPS,
            max:CAMERA_FPS
          },

          facingMode:
            rearCamera
              ? {
                  ideal:"environment"
                }
              : {
                  ideal:"user"
                }

        },

        audio:false

      });


    const track =
      stream.getVideoTracks()[0];


    if(track){

      /*
        Para vigilancia con movimiento,
        pedimos al encoder priorizar movimiento
        y baja latencia.
      */

      try{

        track.contentHint =
          "motion";

      }catch(e){}


      const settings =
        track.getSettings();


      log(
        "Cámara real: " +
        (settings.width || "?") +
        "×" +
        (settings.height || "?") +
        " @ " +
        Math.round(
          settings.frameRate || 0
        ) +
        " FPS."
      );


      quality.textContent =
        "Cámara: " +
        (settings.width || "?") +
        "×" +
        (settings.height || "?") +
        " · " +
        Math.round(
          settings.frameRate || 0
        ) +
        " FPS";

    }


    video.srcObject =
      stream;


    video.muted =
      true;


    await video.play().catch(
      function(){}
    );


    hidePlaceholder();


    setState(
      "Cámara activa",
      "live"
    );


    /*
      Crear conexión Peer.
    */

    createPeer();


  }catch(error){

    log(
      "Error cámara: " +
      errorText(error)
    );


    /*
      Intento de respaldo.
    */

    try{

      log(
        "Intentando 640×480 como respaldo."
      );


      stream =
        await navigator.mediaDevices.getUserMedia({

          video:{
            width:{
              ideal:640
            },

            height:{
              ideal:480
            },

            frameRate:{
              ideal:24,
              max:30
            },

            facingMode:
              rearCamera
                ? {
                    ideal:"environment"
                  }
                : {
                    ideal:"user"
                  }
          },

          audio:false

        });


      video.srcObject =
        stream;


      hidePlaceholder();


      setState(
        "Cámara activa",
        "live"
      );


      createPeer();


    }catch(error2){

      setState(
        "Error de cámara",
        "error"
      );

      errorBox.textContent =
        errorText(error2);

    }

  }

}


/* =========================================================
   OPTIMIZAR SENDER WEBRTC
========================================================= */

async function optimizeSender(){

  if(!activeCall){

    return;

  }


  const pc =
    activeCall.peerConnection;


  if(!pc){

    return;

  }


  const senders =
    pc.getSenders();


  for(
    const sender of senders
  ){

    if(
      !sender.track ||
      sender.track.kind !== "video"
    ){
      continue;
    }


    try{

      const params =
        sender.getParameters();


      if(
        !params.encodings ||
        !params.encodings.length
      ){

        params.encodings = [{}];

      }


      const encoding =
        params.encodings[0];


      /*
        Límite razonable para 720p.
        Evita saturar la red móvil/Wi-Fi.
      */

      encoding.maxBitrate =
        MAX_BITRATE;


      encoding.maxFramerate =
        CAMERA_FPS;


      /*
        No reducir artificialmente
        la resolución.
      */

      encoding.scaleResolutionDownBy =
        1;


      /*
        Prioridad alta para vídeo.
      */

      if(
        "priority" in encoding
      ){

        encoding.priority =
          "high";

      }


      /*
        Intentar mantener resolución.
      */

      if(
        "degradationPreference" in params
      ){

        params.degradationPreference =
          "maintain-resolution";

      }


      await sender.setParameters(
        params
      );


      log(
        "WebRTC configurado: " +
        "720p / 30 FPS / 2.5 Mbps."
      );


    }catch(error){

      log(
        "No se pudieron aplicar todos los parámetros WebRTC: " +
        errorText(error)
      );

    }

  }

}


/* =========================================================
   MODO VISOR
========================================================= */

function startViewer(){

  mode = "viewer";

  stopConnection();

  cameraControls.classList.add(
    "hidden"
  );

  remotePanel.classList.remove(
    "hidden"
  );

  quality.textContent = "";

  errorBox.textContent = "";

  showPlaceholder(
    "Modo visor",
    "Introduce el código del móvil que está en la habitación."
  );

  setState(
    "Esperando código",
    "wait"
  );

  mainInfo.textContent =
    "Introduce el código de la cámara y pulsa Conectar.";

}


/* =========================================================
   CONECTAR VISOR
========================================================= */

function connectViewer(){

  const cameraId =
    room.value.trim();


  if(!cameraId){

    errorBox.textContent =
      "Introduce el código de la cámara.";

    return;

  }


  mode = "viewer";

  stopConnection();

  errorBox.textContent = "";

  quality.textContent = "";


  showPlaceholder(
    "Conectando...",
    "Estableciendo vídeo de baja latencia."
  );


  setState(
    "Conectando...",
    "wait"
  );


  log(
    "Conectando con cámara: " +
    cameraId
  );


  /*
    Stream auxiliar.
    PeerJS necesita un MediaStream
    para iniciar la llamada.
  */

  const canvas =
    document.createElement("canvas");

  canvas.width = 2;
  canvas.height = 2;


  const ctx =
    canvas.getContext("2d");

  ctx.fillStyle =
    "#000";

  ctx.fillRect(
    0,
    0,
    2,
    2
  );


  const dummyStream =
    canvas.captureStream(1);


  createPeer();


  peer.once(
    "open",
    function(){

      log(
        "Peer visor listo."
      );


      activeCall =
        peer.call(
          cameraId,
          dummyStream
        );


      if(!activeCall){

        errorBox.textContent =
          "No se pudo iniciar la llamada.";

        return;

      }


      activeCall.on(
        "stream",
        async function(remoteStream){

          log(
            "Vídeo recibido."
          );


          video.srcObject =
            remoteStream;


          video.muted =
            true;


          video.playsInline =
            true;


          hidePlaceholder();


          setState(
            "Viendo cámara",
            "live"
          );


          try{

            await video.play();

          }catch(error){

            log(
              "El navegador necesita interacción para reproducir."
            );

          }


          updateRemoteQuality();


          startStats();


          mainInfo.textContent =
            "Conectado al móvil de la habitación.";

        }
      );


      activeCall.on(
        "close",
        function(){

          log(
            "Conexión cerrada."
          );


          setState(
            "Desconectado",
            "error"
          );


          stopStats();


          showPlaceholder(
            "Conexión cerrada",
            "El móvil de la habitación dejó de transmitir."
          );

        }
      );


      activeCall.on(
        "error",
        function(error){

          log(
            "Error WebRTC: " +
            errorText(error)
          );


          setState(
            "Error",
            "error"
          );


          errorBox.textContent =
            errorText(error);

        }
      );

    }
  );

}


/* =========================================================
   CALIDAD RECIBIDA
========================================================= */

function updateRemoteQuality(){

  if(
    !video.videoWidth ||
    !video.videoHeight
  ){

    return;

  }


  quality.textContent =
    "Recibiendo: " +
    video.videoWidth +
    "×" +
    video.videoHeight;

}


/* =========================================================
   ESTADÍSTICAS WEBRTC
========================================================= */

function startStats(){

  stopStats();


  statsTimer =
    setInterval(
      async function(){

        if(
          !activeCall ||
          !activeCall.peerConnection
        ){

          return;

        }


        try{

          const stats =
            await activeCall.peerConnection.getStats();


          let inbound = null;


          stats.forEach(
            function(report){

              if(
                report.type === "inbound-rtp" &&
                (
                  report.kind === "video" ||
                  report.mediaType === "video"
                )
              ){

                inbound = report;

              }

            }
          );


          if(!inbound){

            return;

          }


          const now =
            performance.now();


          let bitrate = 0;


          if(
            lastStatsTime > 0
          ){

            const seconds =
              (
                now -
                lastStatsTime
              ) / 1000;


            const bytes =
              (
                inbound.bytesReceived -
                lastBytesReceived
              );


            if(seconds > 0){

              bitrate =
                (
                  bytes *
                  8 /
                  seconds
                ) / 1000000;

            }

          }


          lastBytesReceived =
            inbound.bytesReceived || 0;


          lastStatsTime =
            now;


          const width =
            inbound.frameWidth ||
            video.videoWidth ||
            0;


          const height =
            inbound.frameHeight ||
            video.videoHeight ||
            0;


          const fps =
            inbound.framesPerSecond ||
            0;


          const lost =
            inbound.packetsLost ||
            0;


          quality.textContent =
            width +
            "×" +
            height +
            " · " +
            fps.toFixed(0) +
            " FPS · " +
            bitrate.toFixed(1) +
            " Mbps · perdidos " +
            lost;


          /*
            Si hay demasiada pérdida,
            avisamos sin cortar la conexión.
          */

          if(lost > 30){

            mainInfo.textContent =
              "La red está perdiendo paquetes. " +
              "La calidad puede reducirse para mantener la fluidez.";

          }else{

            mainInfo.textContent =
              "Conexión estable.";

          }

        }catch(error){

          /*
            Algunos navegadores limitan getStats.
            No es motivo para cortar el vídeo.
          */

        }

      },
      2000
    );

}


/* =========================================================
   PARAR ESTADÍSTICAS
========================================================= */

function stopStats(){

  if(statsTimer){

    clearInterval(
      statsTimer
    );

    statsTimer = null;

  }

  lastBytesReceived = 0;

  lastStatsTime = 0;

}


/* =========================================================
   DETENER CONEXIONES
========================================================= */

function stopConnection(){

  stopStats();


  if(activeCall){

    try{
      activeCall.close();
    }catch(e){}

    activeCall = null;

  }


  if(peer){

    try{
      peer.destroy();
    }catch(e){}

    peer = null;

  }

}


/* =========================================================
   APAGAR TODO
========================================================= */

function stopAll(){

  stopConnection();


  if(stream){

    stream.getTracks().forEach(
      function(track){

        try{
          track.stop();
        }catch(e){}

      }
    );

    stream = null;

  }


  video.srcObject = null;


  quality.textContent = "";

  errorBox.textContent = "";


  setState(
    "Apagado"
  );


  showPlaceholder(
    "Monitor de habitación",
    "Selecciona Modo cámara o Modo visor."
  );

}


/* =========================================================
   CAMBIAR CÁMARA
========================================================= */

document.getElementById(
  "flip"
).onclick =
function(){

  rearCamera =
    !rearCamera;

  startCamera();

};


/* =========================================================
   BOTONES
========================================================= */

document.getElementById(
  "cameraMode"
).onclick =
function(){

  remotePanel.classList.add(
    "hidden"
  );

  cameraControls.classList.remove(
    "hidden"
  );

  startCamera();

};


document.getElementById(
  "viewerMode"
).onclick =
function(){

  stopAll();

  startViewer();

};


document.getElementById(
  "start"
).onclick =
function(){

  startCamera();

};


document.getElementById(
  "stop"
).onclick =
function(){

  stopAll();

};


document.getElementById(
  "connect"
).onclick =
function(){

  connectViewer();

};


room.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){

      connectViewer();

    }

  }
);


/* =========================================================
   DOBLE CLICK = PANTALLA COMPLETA
========================================================= */

document.addEventListener(
  "dblclick",
  async function(){

    try{

      if(!document.fullscreenElement){

        await document.documentElement.requestFullscreen();

      }

    }catch(e){}

  }
);


/* =========================================================
   INICIO
========================================================= */

setState(
  "Listo"
);

showPlaceholder(
  "Monitor de habitación",
  "Usa Modo cámara en el móvil que se queda en la habitación y Modo visor en el otro móvil."
);

</script>
