<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a0f">
<title>Monitor de habitación</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
:root{
  color-scheme:dark;
  --bg:#080a0f;
  --panel:#11151d;
  --text:#f4f7fb;
  --muted:#9ba5b4;
  --line:#252c38;
  --accent:#69e6a5;
  --danger:#ff6675
}

*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:var(--bg);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

#app{
  min-height:100%;
  background:var(--bg);
  color:var(--text);
  display:flex;
  flex-direction:column
}

header{
  height:64px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  border-bottom:1px solid var(--line);
  background:rgba(8,10,15,.94);
  z-index:3
}

h1{
  font-size:17px;
  margin:0;
  font-weight:700
}

.status{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-size:12px
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#596273
}

.dot.live{
  background:var(--accent);
  box-shadow:0 0 12px rgba(105,230,165,.6)
}

main{
  flex:1;
  display:flex;
  flex-direction:column;
  min-height:0
}

.viewer{
  position:relative;
  flex:1;
  min-height:360px;
  background:#000;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center
}

video{
  width:100%;
  height:100%;
  object-fit:cover
}

#cameraVideo{
  display:none
}

.placeholder{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:28px;
  text-align:center;
  background:radial-gradient(circle at 50% 40%,#171d28,#000 72%)
}

.placeholder.hidden{
  display:none
}

.card{
  max-width:390px
}

.cam-icon{
  font-size:42px;
  margin-bottom:12px
}

.card h2{
  font-size:21px;
  margin:0 0 8px
}

.card p{
  color:var(--muted);
  line-height:1.5;
  margin:0 0 20px;
  font-size:14px
}

button{
  border:0;
  border-radius:13px;
  padding:13px 18px;
  font:inherit;
  font-weight:700;
  cursor:pointer
}

.primary{
  background:var(--accent);
  color:#07130d
}

.secondary{
  background:#1a202b;
  color:var(--text);
  border:1px solid var(--line)
}

.controls{
  padding:14px 16px calc(14px + env(safe-area-inset-bottom));
  background:var(--panel);
  border-top:1px solid var(--line);
  display:flex;
  gap:10px;
  flex-wrap:wrap
}

.controls button{
  flex:1;
  min-width:130px
}

.error{
  color:#ff9aa4;
  font-size:13px;
  margin:8px 0 0;
  word-break:break-word
}

.note{
  padding:10px 16px;
  color:var(--muted);
  font-size:11px;
  text-align:center;
  background:#0d1016
}

#remotePanel{
  padding:14px 16px
}

#room{
  padding:12px;
  border-radius:10px;
  border:1px solid var(--line);
  background:#11151d;
  color:#f4f7fb;
  width:100%;
  margin-bottom:8px;
  font:inherit;
  outline:none
}

#room:focus{
  border-color:var(--accent)
}

#cameraCode{
  color:var(--accent);
  font-weight:700;
  word-break:break-all
}

@media (orientation:landscape){
  header{height:52px}
  .viewer{min-height:240px}
  .controls{padding:9px 12px}
  .note{display:none}
}
</style>
</head>

<body>

<div id="app">

<header>
  <h1>Monitor de habitación</h1>

  <div class="status">
    <span id="dot" class="dot"></span>
    <span id="state">Cámara apagada</span>
  </div>
</header>

<main>

<section class="viewer">

  <video id="video" autoplay playsinline muted></video>

  <!-- Vídeo auxiliar utilizado únicamente para iniciar la llamada WebRTC -->
  <video id="cameraVideo" autoplay playsinline muted></video>

  <div id="placeholder" class="placeholder">

    <div class="card">

      <div class="cam-icon">◉</div>

      <h2 id="placeholderTitle">Listo para monitorizar</h2>

      <p id="placeholderText">
        Pulsa «Activar cámara». El navegador te pedirá permiso
        y se intentará usar la cámara trasera del móvil.
      </p>

      <button id="start" class="primary">
        Activar cámara
      </button>

      <div id="error" class="error"></div>

    </div>

  </div>

</section>

<div class="controls">

  <button id="flip" class="secondary">
    Cambiar cámara
  </button>

  <button id="fullscreen" class="secondary">
    Pantalla completa
  </button>

  <button id="stop" class="secondary">
    Apagar
  </button>

</div>

<div class="controls">

  <button id="cameraMode" class="primary">
    📷 Modo cámara
  </button>

  <button id="viewerMode" class="secondary">
    👁 Ver otra cámara
  </button>

</div>

<div id="remotePanel" style="display:none">

  <input
    id="room"
    placeholder="Código de la cámara"
    autocomplete="off"
    autocapitalize="none"
    spellcheck="false"
  >

  <button
    id="connect"
    class="primary"
    style="width:100%"
  >
    Conectar
  </button>

</div>

<div class="note">
  <span id="cameraInfo">
    En modo cámara aparecerá un código. Introduce ese código
    en el segundo móvil para ver la cámara.
  </span>
</div>

</main>

</div>

<script>

"use strict";

/* =========================================================
   VARIABLES
========================================================= */

let stream = null;
let rear = true;
let peer = null;
let currentMode = "camera";
let currentCall = null;
let dummyStream = null;

const video = document.getElementById("video");
const placeholder = document.getElementById("placeholder");
const placeholderTitle = document.getElementById("placeholderTitle");
const placeholderText = document.getElementById("placeholderText");

const state = document.getElementById("state");
const dot = document.getElementById("dot");
const error = document.getElementById("error");

const room = document.getElementById("room");
const remotePanel = document.getElementById("remotePanel");
const cameraInfo = document.getElementById("cameraInfo");


/* =========================================================
   UTILIDADES
========================================================= */

function showError(message){
  error.textContent = message || "";
}

function setLive(text){
  state.textContent = text;
  dot.classList.add("live");
}

function setOffline(text){
  state.textContent = text;
  dot.classList.remove("live");
}

function showPlaceholder(title,text){
  placeholderTitle.textContent = title;
  placeholderText.textContent = text;
  placeholder.classList.remove("hidden");
}

function hidePlaceholder(){
  placeholder.classList.add("hidden");
}


/* =========================================================
   CREAR PEER
========================================================= */

function createPeer(){

  if(peer){

    try{
      peer.destroy();
    }catch(e){}

    peer = null;
  }

  peer = new Peer({

    config:{
      iceServers:[
        {
          urls:"stun:stun.l.google.com:19302"
        },
        {
          urls:"stun:stun1.l.google.com:19302"
        }
      ]
    }

  });

  return peer;
}


/* =========================================================
   INICIAR CÁMARA
========================================================= */

async function startCamera(){

  currentMode = "camera";

  showError("");

  if(
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia
  ){

    showError(
      "Este navegador no permite acceder a la cámara. Comprueba que estás usando HTTPS."
    );

    return;
  }

  stopCamera(false);

  try{

    stream = await navigator.mediaDevices.getUserMedia({

      video:{
        facingMode: rear
          ? {ideal:"environment"}
          : {ideal:"user"},

        width:{ideal:1280},
        height:{ideal:720}
      },

      audio:false

    });

    video.srcObject = stream;

    hidePlaceholder();

    setLive("Iniciando cámara...");

    /*
      Creamos el Peer de la cámara.
    */

    createPeer();

    peer.on("open",function(id){

      setLive("Cámara activa");

      cameraInfo.innerHTML =
        "Código de esta cámara: <span id='cameraCode'>" +
        escapeHtml(id) +
        "</span><br>Comparte este código con el móvil visor.";

    });


    /*
      El móvil visor llama a este Peer.
      Respondemos enviando nuestra cámara real.
    */

    peer.on("call",function(call){

      if(
        currentMode === "camera" &&
        stream
      ){

        try{

          call.answer(stream);

          currentCall = call;

          call.on("close",function(){

            currentCall = null;

          });

          call.on("error",function(){

            currentCall = null;

          });

        }catch(e){

          showError(
            "No se pudo responder a la conexión: " +
            e.message
          );

        }

      }

    });


    peer.on("error",function(e){

      showError(
        "Error de conexión: " +
        (e.message || "Error desconocido")
      );

    });


  }catch(e){

    stream = null;

    setOffline("Cámara apagada");

    if(e.name === "NotAllowedError"){

      showError(
        "Permiso de cámara denegado. Permite el acceso a la cámara en el navegador."
      );

    }else if(e.name === "NotFoundError"){

      showError(
        "No se encontró ninguna cámara."
      );

    }else{

      showError(
        "No se pudo iniciar la cámara: " +
        (e.message || e.name)
      );

    }

  }

}


/* =========================================================
   APAGAR CÁMARA / CONEXIÓN
========================================================= */

function stopCamera(show = true){

  if(currentCall){

    try{
      currentCall.close();
    }catch(e){}

    currentCall = null;
  }

  if(stream){

    stream.getTracks().forEach(function(track){

      try{
        track.stop();
      }catch(e){}

    });

    stream = null;
  }

  if(peer){

    try{
      peer.destroy();
    }catch(e){}

    peer = null;
  }

  video.srcObject = null;

  setOffline("Cámara apagada");

  if(show){

    showPlaceholder(
      "Listo para monitorizar",
      "Pulsa «Activar cámara». El navegador te pedirá permiso y se intentará usar la cámara trasera del móvil."
    );

  }
}


/* =========================================================
   PISTA AUXILIAR PARA EL VISOR
========================================================= */

function createDummyStream(){

  /*
    PeerJS necesita una MediaStream para iniciar
    una llamada. Creamos una pista de vídeo silenciosa
    mediante Canvas.

    Esta pista NO es la cámara del visor.
    El móvil cámara responderá enviando su vídeo real.
  */

  try{

    const canvas = document.createElement("canvas");

    canvas.width = 2;
    canvas.height = 2;

    const ctx = canvas.getContext("2d");

    ctx.fillRect(0,0,2,2);

    const stream = canvas.captureStream(1);

    dummyStream = stream;

    return stream;

  }catch(e){

    return null;

  }
}


/* =========================================================
   CONECTAR VISOR
========================================================= */

function connectViewer(){

  const id = room.value.trim();

  if(!id){

    showError(
      "Escribe el código de la cámara."
    );

    return;
  }

  showError("");

  currentMode = "viewer";

  if(currentCall){

    try{
      currentCall.close();
    }catch(e){}

    currentCall = null;
  }

  if(peer){

    try{
      peer.destroy();
    }catch(e){}

    peer = null;
  }

  setOffline("Conectando...");

  showPlaceholder(
    "Conectando con la cámara",
    "Espera unos segundos mientras se establece la conexión."
  );


  createPeer();


  peer.on("open",function(){

    /*
      Creamos el stream auxiliar.
    */

    const localStream = createDummyStream();

    if(!localStream){

      showError(
        "El navegador no permite iniciar la conexión de vídeo."
      );

      return;
    }


    try{

      /*
        Iniciamos la llamada al móvil cámara.
      */

      const call = peer.call(
        id,
        localStream
      );

      currentCall = call;


      if(!call){

        showError(
          "No se pudo iniciar la llamada."
        );

        setOffline("Error");

        return;
      }


      /*
        Cuando llega el vídeo real de la cámara,
        lo ponemos en el elemento de vídeo.
      */

      call.on("stream",function(remoteStream){

        video.srcObject = remoteStream;

        hidePlaceholder();

        setLive("Viendo cámara");

      });


      call.on("close",function(){

        currentCall = null;

        setOffline("Conexión cerrada");

        showPlaceholder(
          "Conexión cerrada",
          "La cámara ha dejado de enviar vídeo."
        );

      });


      call.on("error",function(e){

        currentCall = null;

        setOffline("Error");

        showError(
          "Error durante la conexión: " +
          (e.message || "Error desconocido")
        );

      });

    }catch(e){

      setOffline("Error");

      showError(
        "No se pudo conectar: " +
        (e.message || e.name)
      );

    }

  });


  peer.on("error",function(e){

    setOffline("Error");

    let message = e.message || "Error desconocido";

    if(e.type === "peer-unavailable"){

      message =
        "No se encuentra esa cámara. Comprueba que el móvil de la habitación está encendido y que el código es correcto.";

    }

    if(e.type === "network"){

      message =
        "Problema de red. Comprueba la conexión a Internet de ambos móviles.";

    }

    showError(
      message
    );

  });

}


/* =========================================================
   ESCAPAR TEXTO
========================================================= */

function escapeHtml(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* =========================================================
   BOTÓN ACTIVAR
========================================================= */

document.getElementById("start").onclick =
function(){

  startCamera();

};


/* =========================================================
   CAMBIAR CÁMARA
========================================================= */

document.getElementById("flip").onclick =
function(){

  rear = !rear;

  if(currentMode === "camera" && stream){

    startCamera();

  }

};


/* =========================================================
   APAGAR
========================================================= */

document.getElementById("stop").onclick =
function(){

  stopCamera();

};


/* =========================================================
   PANTALLA COMPLETA
========================================================= */

document.getElementById("fullscreen").onclick =
async function(){

  try{

    if(!document.fullscreenElement){

      await document.documentElement.requestFullscreen();

    }else{

      await document.exitFullscreen();

    }

  }catch(e){}

};


/* =========================================================
   MODO CÁMARA
========================================================= */

document.getElementById("cameraMode").onclick =
function(){

  currentMode = "camera";

  remotePanel.style.display = "none";

  cameraInfo.innerHTML =
    "En modo cámara aparecerá un código. Introduce ese código en el segundo móvil para ver la cámara.";

  showError("");

  if(!stream){

    startCamera();

  }else{

    setLive("Cámara activa");

  }

};


/* =========================================================
   MODO VISOR
========================================================= */

document.getElementById("viewerMode").onclick =
function(){

  currentMode = "viewer";

  /*
    Cerramos cámara local si estuviera activa.
  */

  if(stream){

    stream.getTracks().forEach(function(track){

      try{
        track.stop();
      }catch(e){}

    });

    stream = null;

  }

  if(currentCall){

    try{
      currentCall.close();
    }catch(e){}

    currentCall = null;
  }

  if(peer){

    try{
      peer.destroy();
    }catch(e){}

    peer = null;
  }

  video.srcObject = null;

  remotePanel.style.display = "block";

  setOffline("Esperando conexión");

  showPlaceholder(
    "Ver otra cámara",
    "Introduce el código que aparece en el móvil que está en la habitación."
  );

  cameraInfo.textContent =
    "Escribe el código de la cámara y pulsa «Conectar».";

  showError("");

};


/* =========================================================
   CONECTAR
========================================================= */

document.getElementById("connect").onclick =
function(){

  connectViewer();

};


/* =========================================================
   ENTER EN EL CAMPO
========================================================= */

room.addEventListener("keydown",function(e){

  if(e.key === "Enter"){

    connectViewer();

  }

});


/* =========================================================
   LIMPIAR PISTA AUXILIAR AL SALIR
========================================================= */

window.addEventListener("beforeunload",function(){

  if(dummyStream){

    dummyStream.getTracks().forEach(function(track){

      try{
        track.stop();
      }catch(e){}

    });

  }

  if(stream){

    stream.getTracks().forEach(function(track){

      try{
        track.stop();
      }catch(e){}

    });

  }

  if(peer){

    try{
      peer.destroy();
    }catch(e){}

  }

});


/*
  IMPORTANTE:
  No arrancamos la cámara automáticamente al cargar la página.
  En móviles, getUserMedia funciona de forma mucho más fiable
  cuando se inicia después de una acción del usuario.
*/

</script>

</body>
</html>
