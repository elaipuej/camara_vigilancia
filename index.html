<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080a0f">

<title>Monitor de habitación</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
:root{
  color-scheme:dark;
  --bg:#080a0f;
  --panel:#11151d;
  --panel2:#0d1016;
  --text:#f4f7fb;
  --muted:#9ba5b4;
  --line:#252c38;
  --accent:#69e6a5;
  --danger:#ff6675;
  --warning:#ffd166;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  min-height:100vh;
}

#app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
}

header{
  height:58px;
  flex:none;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 15px;
  background:#080a0f;
  border-bottom:1px solid var(--line);
}

h1{
  margin:0;
  font-size:17px;
}

.status{
  display:flex;
  align-items:center;
  gap:7px;
  color:var(--muted);
  font-size:12px;
}

.dot{
  width:8px;
  height:8px;
  border-radius:50%;
  background:#596273;
}

.dot.live{
  background:var(--accent);
  box-shadow:0 0 12px rgba(105,230,165,.7);
}

.dot.wait{
  background:var(--warning);
}

.dot.error{
  background:var(--danger);
}

main{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
}

.viewer{
  position:relative;
  flex:1;
  min-height:280px;
  background:#000;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
}

#video{
  width:100%;
  height:100%;
  display:block;
  background:#000;
  object-fit:contain;
}

.placeholder{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
  text-align:center;
  background:radial-gradient(circle at 50% 40%,#171d28,#000 75%);
}

.placeholder.hidden{
  display:none;
}

.card{
  max-width:420px;
}

.icon{
  font-size:44px;
  margin-bottom:10px;
}

.card h2{
  margin:0 0 8px;
  font-size:21px;
}

.card p{
  margin:0;
  color:var(--muted);
  line-height:1.5;
  font-size:14px;
}

.pin{
  margin:18px 0;
  font-size:42px;
  letter-spacing:10px;
  font-weight:800;
  color:var(--accent);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
}

.controls{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  padding:10px 12px;
  background:var(--panel);
  border-top:1px solid var(--line);
}

button{
  flex:1;
  min-width:110px;
  border:0;
  border-radius:11px;
  padding:12px 14px;
  font:inherit;
  font-weight:700;
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

.primary{
  background:var(--accent);
  color:#07130d;
}

.secondary{
  background:#1a202b;
  color:var(--text);
  border:1px solid var(--line);
}

#remotePanel{
  padding:14px 12px;
  background:var(--panel2);
  border-top:1px solid var(--line);
}

#room{
  display:block;
  width:100%;
  padding:14px;
  margin-bottom:8px;
  border:1px solid var(--line);
  border-radius:11px;
  outline:none;
  background:#11151d;
  color:var(--text);
  font:inherit;
  font-size:22px;
  text-align:center;
  letter-spacing:7px;
  font-weight:700;
}

#room:focus{
  border-color:var(--accent);
}

.info{
  padding:9px 12px;
  background:var(--panel2);
  color:var(--muted);
  font-size:11px;
  line-height:1.5;
  text-align:center;
}

#quality{
  color:var(--accent);
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  margin-top:3px;
}

#error{
  color:#ff9aa4;
  margin-top:4px;
}

.hidden{
  display:none!important;
}

@media(max-width:600px){

  header{
    height:56px;
  }

  .viewer{
    min-height:260px;
  }

  .pin{
    font-size:36px;
  }

}

@media(orientation:landscape){

  header{
    height:48px;
  }

  .viewer{
    min-height:220px;
  }

}
</style>
</head>

<body>

<div id="app">

<header>

  <h1>Monitor de habitación</h1>

  <div class="status">
    <span id="dot" class="dot"></span>
    <span id="state">Listo</span>
  </div>

</header>

<main>

<section class="viewer">

  <video
    id="video"
    autoplay
    playsinline
    muted
    preload="auto">
  </video>

  <div id="placeholder" class="placeholder">

    <div class="card">

      <div class="icon">📷</div>

      <h2 id="placeholderTitle">
        Monitor de habitación
      </h2>

      <p id="placeholderText">
        Selecciona el modo que quieres utilizar.
      </p>

      <div
        id="pinDisplay"
        class="pin hidden">
      </div>

    </div>

  </div>

</section>


<!-- MODOS -->

<div class="controls">

  <button
    id="cameraMode"
    class="primary">
    📷 Modo cámara
  </button>

  <button
    id="viewerMode"
    class="secondary">
    👁 Modo visor
  </button>

</div>


<!-- CONTROLES CÁMARA -->

<div
  id="cameraControls"
  class="controls hidden">

  <button
    id="start"
    class="primary">
    Activar cámara
  </button>

  <button
    id="flip"
    class="secondary">
    Cambiar cámara
  </button>

  <button
    id="stop"
    class="secondary">
    Apagar
  </button>

  <button
    id="cameraMic"
    class="secondary">
    🎙️ Micrófono ON
  </button>

  <button
    id="cameraSpeaker"
    class="secondary">
    🔊 Escuchar visor ON
  </button>

</div>


<!-- VISOR -->

<div
  id="remotePanel"
  class="hidden">

  <input
    id="room"
    type="tel"
    inputmode="numeric"
    maxlength="4"
    pattern="[0-9]{4}"
    placeholder="0000"
    autocomplete="off">

  <button
    id="connect"
    class="primary">
    Conectar
  </button>

  <button
    id="viewerSound"
    class="secondary">
    🔊 Sonido ON
  </button>

  <button
    id="viewerMic"
    class="secondary">
    🎙️ Hablar ON
  </button>

  <button
    id="viewerDisconnect"
    class="secondary">
    Desconectar
  </button>

</div>

<audio
  id="talkbackAudio"
  autoplay
  playsinline>
</audio>


<div class="info">

  <div id="mainInfo">
    Selecciona un modo para comenzar.
  </div>

  <div id="quality"></div>

  <div id="error"></div>

</div>

</main>

</div>


<script>

"use strict";


/* =========================================================
   CONFIGURACIÓN DE VÍDEO
========================================================= */

const CAMERA_WIDTH = 1280;
const CAMERA_HEIGHT = 720;
const CAMERA_FPS = 30;

/*
  2,5 Mbps máximo.
  Está pensado para mantener la fluidez.
*/
const MAX_BITRATE = 2500000;


/* =========================================================
   ELEMENTOS
========================================================= */

const video =
  document.getElementById("video");

const placeholder =
  document.getElementById("placeholder");

const placeholderTitle =
  document.getElementById("placeholderTitle");

const placeholderText =
  document.getElementById("placeholderText");

const pinDisplay =
  document.getElementById("pinDisplay");

const state =
  document.getElementById("state");

const dot =
  document.getElementById("dot");

const mainInfo =
  document.getElementById("mainInfo");

const quality =
  document.getElementById("quality");

const errorBox =
  document.getElementById("error");

const remotePanel =
  document.getElementById("remotePanel");

const cameraControls =
  document.getElementById("cameraControls");

const room =
  document.getElementById("room");

const cameraMicButton =
  document.getElementById("cameraMic");

const cameraSpeakerButton =
  document.getElementById("cameraSpeaker");

const viewerSoundButton =
  document.getElementById("viewerSound");

const viewerMicButton =
  document.getElementById("viewerMic");

const viewerDisconnectButton =
  document.getElementById("viewerDisconnect");

const talkbackAudio =
  document.getElementById("talkbackAudio");


/* =========================================================
   VARIABLES
========================================================= */

let peer = null;
let stream = null;
let activeCall = null;

let mode = null;

let rearCamera = true;

let cameraPin = null;

let statsTimer = null;

let lastBytesReceived = 0;
let lastStatsTime = 0;

let talkbackStream = null;
let cameraMicEnabled = true;
let cameraSpeakerEnabled = true;
let viewerMicEnabled = true;
let viewerSoundEnabled = true;


/* =========================================================
   UTILIDADES
========================================================= */

function setState(text,type="normal"){

  state.textContent = text;

  dot.className = "dot";

  if(type === "live"){
    dot.classList.add("live");
  }

  if(type === "wait"){
    dot.classList.add("wait");
  }

  if(type === "error"){
    dot.classList.add("error");
  }

}


function showPlaceholder(title,text){

  placeholderTitle.textContent =
    title;

  placeholderText.textContent =
    text;

  placeholder.classList.remove(
    "hidden"
  );

}


function hidePlaceholder(){

  placeholder.classList.add(
    "hidden"
  );

}


function errorText(error){

  if(!error){
    return "Error desconocido";
  }

  if(typeof error === "string"){
    return error;
  }

  return (
    error.name
      ? error.name + ": "
      : ""
  ) +
  (
    error.message ||
    error.type ||
    "Error desconocido"
  );

}


/* =========================================================
   GENERAR PIN DE 4 CIFRAS
========================================================= */

function generatePin(){

  return String(
    Math.floor(
      1000 +
      Math.random() * 9000
    )
  );

}


/* =========================================================
   CREAR PEER CON PIN
========================================================= */

function createCameraPeer(){

  return new Promise(
    function(resolve,reject){

      const pin =
        generatePin();


      log(
        "Solicitando PIN " +
        pin
      );


      const newPeer =
        new Peer(
          pin,
          {
            debug:1,

            config:{
              iceServers:[
                {
                  urls:
                    "stun:stun.l.google.com:19302"
                },
                {
                  urls:
                    "stun:stun1.l.google.com:19302"
                }
              ]
            }
          }
        );


      let finished = false;


      newPeer.on(
        "open",
        function(id){

          if(finished){
            return;
          }

          finished = true;

          peer =
            newPeer;

          cameraPin =
            id;

          resolve(id);

        }
      );


      newPeer.on(
        "error",
        function(error){

          /*
            Si el PIN ya está ocupado,
            generamos otro automáticamente.
          */

          if(
            error &&
            (
              error.type ===
                "unavailable-id" ||
              error.type ===
                "server-error"
            )
          ){

            try{
              newPeer.destroy();
            }catch(e){}

            if(!finished){

              finished = true;

              /*
                Volver a intentarlo
                con otro PIN.
              */

              setTimeout(
                function(){

                  createCameraPeer()
                    .then(resolve)
                    .catch(reject);

                },
                300
              );

            }

            return;

          }


          if(!finished){

            finished = true;

            reject(error);

          }

        }
      );

    }
  );

}


/* =========================================================
   PEER VISOR
========================================================= */

function createViewerPeer(){

  return new Promise(
    function(resolve,reject){

      const newPeer =
        new Peer(
          undefined,
          {
            debug:1,

            config:{
              iceServers:[
                {
                  urls:
                    "stun:stun.l.google.com:19302"
                },
                {
                  urls:
                    "stun:stun1.l.google.com:19302"
                }
              ]
            }
          }
        );


      newPeer.on(
        "open",
        function(){

          peer =
            newPeer;

          resolve(newPeer);

        }
      );


      newPeer.on(
        "error",
        function(error){

          reject(error);

        }
      );

    }
  );

}


/* =========================================================
   LOG
========================================================= */

function log(message){

  console.log(
    "[" +
    new Date().toLocaleTimeString() +
    "] " +
    message
  );

}


/* =========================================================
   OPTIMIZAR EMISIÓN WEBRTC
========================================================= */

async function optimizeSender(){

  if(!activeCall){
    return;
  }


  const pc =
    activeCall.peerConnection;


  if(!pc){
    return;
  }


  const senders =
    pc.getSenders();


  for(
    const sender of senders
  ){

    if(
      !sender.track ||
      sender.track.kind !== "video"
    ){

      continue;

    }


    try{

      const params =
        sender.getParameters();


      if(
        !params.encodings ||
        !params.encodings.length
      ){

        params.encodings = [{}];

      }


      const encoding =
        params.encodings[0];


      /*
        Bitrate máximo de 2,5 Mbps.
      */

      encoding.maxBitrate =
        MAX_BITRATE;


      encoding.maxFramerate =
        CAMERA_FPS;


      /*
        No reducir artificialmente
        la resolución.
      */

      encoding.scaleResolutionDownBy =
        1;


      if(
        "priority" in encoding
      ){

        encoding.priority =
          "high";

      }


      if(
        "degradationPreference" in params
      ){

        params.degradationPreference =
          "maintain-resolution";

      }


      await sender.setParameters(
        params
      );


      log(
        "WebRTC optimizado: 720p / 30 FPS / 2,5 Mbps."
      );


    }catch(error){

      log(
        "No se pudieron aplicar todos los parámetros: " +
        errorText(error)
      );

    }

  }

}


/* =========================================================
   INICIAR CÁMARA
========================================================= */

async function startCamera(){

  mode = "camera";

  errorBox.textContent = "";

  quality.textContent = "";

  stopConnection();


  showPlaceholder(
    "Activando cámara...",
    "Configurando vídeo de baja latencia."
  );


  setState(
    "Activando cámara",
    "wait"
  );


  try{

    stream =
      await navigator.mediaDevices.getUserMedia({

        video:{

          width:{
            ideal:CAMERA_WIDTH
          },

          height:{
            ideal:CAMERA_HEIGHT
          },

          frameRate:{
            ideal:CAMERA_FPS,
            max:CAMERA_FPS
          },

          facingMode:
            rearCamera
              ? {ideal:"environment"}
              : {ideal:"user"}

        },

        audio:{

          echoCancellation:true,
          noiseSuppression:true,
          autoGainControl:true

        }

      });


    const track =
      stream.getVideoTracks()[0];


    if(track){

      try{
        track.contentHint =
          "motion";
      }catch(e){}


      const settings =
        track.getSettings();


      quality.textContent =
        "Cámara: " +
        (settings.width || "?") +
        "×" +
        (settings.height || "?") +
        " · " +
        Math.round(
          settings.frameRate || 0
        ) +
        " FPS";

    }


    video.srcObject =
      stream;


    video.muted =
      true;


    await video.play().catch(
      function(){}
    );


    hidePlaceholder();


    /*
      Crear PIN de 4 cifras.
    */

    const pin =
      await createCameraPeer();


    pinDisplay.textContent =
      pin;


    pinDisplay.classList.remove(
      "hidden"
    );


    placeholderTitle.textContent =
      "Código de conexión";


    placeholderText.textContent =
      "Introduce este código de 4 cifras en el otro móvil.";


    /*
      El vídeo local sigue visible.
      Ocultamos el PIN cuando empieza
      la visualización local.
    */

    hidePlaceholder();


    setState(
      "Cámara activa",
      "live"
    );


    mainInfo.innerHTML =
      "Código de cámara: " +
      "<strong>" +
      pin +
      "</strong>";

    /*
      Escuchar llamadas.
    */

    peer.on(
      "call",
      function(incomingCall){

        log(
          "Llamada recibida."
        );


        if(!stream){

          return;

        }


        activeCall =
          incomingCall;


        setState(
          "Transmitiendo",
          "live"
        );


        incomingCall.answer(
          stream
        );

        /*
          El visor también puede enviar su micrófono.
          Escuchamos ese audio aquí en el móvil cámara.
        */
        incomingCall.on(
          "stream",
          async function(remoteStream){

            const audioTracks =
              remoteStream.getAudioTracks();

            if(audioTracks.length){

              talkbackAudio.srcObject =
                remoteStream;

              talkbackAudio.muted =
                !cameraSpeakerEnabled;

              talkbackAudio.volume = 1;

              try{
                await talkbackAudio.play();
              }catch(e){}

              log("Micrófono del visor recibido.");

            }

          }
        );


        setTimeout(
          optimizeSender,
          1000
        );


        incomingCall.on(
          "close",
          function(){

            activeCall = null;

            setState(
              "Cámara activa",
              "live"
            );

          }
        );


        incomingCall.on(
          "error",
          function(error){

            log(
              "Error: " +
              errorText(error)
            );

          }
        );

      }
    );


  }catch(error){

    setState(
      "Error de cámara",
      "error"
    );


    errorBox.textContent =
      errorText(error);

  }

}


/* =========================================================
   MODO VISOR
========================================================= */

function startViewer(){

  mode = "viewer";

  stopConnection();

  cameraControls.classList.add(
    "hidden"
  );

  remotePanel.classList.remove(
    "hidden"
  );


  showPlaceholder(
    "Modo visor",
    "Introduce el código de 4 cifras de la cámara."
  );


  setState(
    "Esperando código",
    "wait"
  );


  mainInfo.textContent =
    "El código tiene 4 cifras.";

}


/* =========================================================
   CONECTAR VISOR
========================================================= */

async function connectViewer(){

  const pin =
    room.value.trim();


  /*
    Solo aceptamos exactamente
    cuatro números.
  */

  if(!/^[0-9]{4}$/.test(pin)){

    errorBox.textContent =
      "El código debe tener exactamente 4 cifras.";

    return;

  }


  errorBox.textContent = "";

  quality.textContent = "";


  showPlaceholder(
    "Conectando...",
    "Buscando la cámara."
  );


  setState(
    "Conectando...",
    "wait"
  );


  try{

    /*
      Peer del visor.
    */

    await createViewerPeer();


    /*
      Stream auxiliar.
    */

    const canvas =
      document.createElement("canvas");

    canvas.width = 2;
    canvas.height = 2;


    const ctx =
      canvas.getContext("2d");

    ctx.fillStyle =
      "#000";

    ctx.fillRect(
      0,
      0,
      2,
      2
    );


    const dummyVideoStream =
      canvas.captureStream(1);

    /*
      El visor solicita su micrófono para poder hablar
      con el móvil que está en la habitación.
    */
    talkbackStream =
      await navigator.mediaDevices.getUserMedia({

        audio:{
          echoCancellation:true,
          noiseSuppression:true,
          autoGainControl:true
        },

        video:false

      });

    talkbackStream
      .getAudioTracks()
      .forEach(function(track){
        track.enabled = viewerMicEnabled;
      });

    const dummyStream =
      new MediaStream([
        ...dummyVideoStream.getVideoTracks(),
        ...talkbackStream.getAudioTracks()
      ]);


    log(
      "Llamando al PIN " +
      pin
    );


    activeCall =
      peer.call(
        pin,
        dummyStream
      );


    if(!activeCall){

      throw new Error(
        "No se pudo crear la llamada."
      );

    }


    activeCall.on(
      "stream",
      async function(remoteStream){

        log(
          "Vídeo recibido."
        );


        video.srcObject =
          remoteStream;


        video.muted =
          !viewerSoundEnabled;

        video.volume = 1;


        video.playsInline =
          true;


        hidePlaceholder();


        setState(
          "Viendo cámara",
          "live"
        );


        try{

          await video.play();

        }catch(e){}


        updateQuality();

        startStats();


        mainInfo.textContent =
          "Conectado a la cámara.";

      }
    );


    activeCall.on(
      "close",
      function(){

        stopStats();

        setState(
          "Desconectado",
          "error"
        );


        showPlaceholder(
          "Conexión cerrada",
          "La cámara dejó de transmitir."
        );

      }
    );


    activeCall.on(
      "error",
      function(error){

        setState(
          "Error",
          "error"
        );


        errorBox.textContent =
          errorText(error);

      }
    );


  }catch(error){

    setState(
      "No conectado",
      "error"
    );


    errorBox.textContent =
      "No se pudo conectar. Comprueba que el código sea correcto.";

    log(
      errorText(error)
    );

  }

}


/* =========================================================
   AUDIO BIDIRECCIONAL
========================================================= */

function updateAudioButtons(){

  cameraMicButton.textContent =
    cameraMicEnabled
      ? "🎙️ Micrófono ON"
      : "🔇 Micrófono OFF";

  cameraSpeakerButton.textContent =
    cameraSpeakerEnabled
      ? "🔊 Escuchar visor ON"
      : "🔇 Escuchar visor OFF";

  viewerSoundButton.textContent =
    viewerSoundEnabled
      ? "🔊 Sonido ON"
      : "🔇 Sonido OFF";

  viewerMicButton.textContent =
    viewerMicEnabled
      ? "🎙️ Hablar ON"
      : "🔇 Hablar OFF";

}


function toggleCameraMic(){

  cameraMicEnabled =
    !cameraMicEnabled;

  if(stream){

    stream
      .getAudioTracks()
      .forEach(function(track){
        track.enabled = cameraMicEnabled;
      });

  }

  updateAudioButtons();

}


function toggleCameraSpeaker(){

  cameraSpeakerEnabled =
    !cameraSpeakerEnabled;

  talkbackAudio.muted =
    !cameraSpeakerEnabled;

  updateAudioButtons();

}


function toggleViewerSound(){

  viewerSoundEnabled =
    !viewerSoundEnabled;

  video.muted =
    !viewerSoundEnabled;

  video.volume = 1;

  if(viewerSoundEnabled){
    video.play().catch(function(){});
  }

  updateAudioButtons();

}


function toggleViewerMic(){

  viewerMicEnabled =
    !viewerMicEnabled;

  if(talkbackStream){

    talkbackStream
      .getAudioTracks()
      .forEach(function(track){
        track.enabled = viewerMicEnabled;
      });

  }

  updateAudioButtons();

}


/* =========================================================
   CALIDAD
========================================================= */

function updateQuality(){

  if(
    !video.videoWidth ||
    !video.videoHeight
  ){

    return;

  }


  quality.textContent =
    "Vídeo: " +
    video.videoWidth +
    "×" +
    video.videoHeight;

}


/* =========================================================
   ESTADÍSTICAS
========================================================= */

function startStats(){

  stopStats();


  statsTimer =
    setInterval(
      async function(){

        if(
          !activeCall ||
          !activeCall.peerConnection
        ){

          return;

        }


        try{

          const stats =
            await activeCall.peerConnection.getStats();


          let inbound = null;


          stats.forEach(
            function(report){

              if(
                report.type === "inbound-rtp" &&
                (
                  report.kind === "video" ||
                  report.mediaType === "video"
                )
              ){

                inbound = report;

              }

            }
          );


          if(!inbound){
            return;
          }


          const now =
            performance.now();


          let bitrate = 0;


          if(lastStatsTime){

            const seconds =
              (
                now -
                lastStatsTime
              ) / 1000;


            const bytes =
              (
                inbound.bytesReceived -
                lastBytesReceived
              );


            if(seconds > 0){

              bitrate =
                bytes *
                8 /
                seconds /
                1000000;

            }

          }


          lastBytesReceived =
            inbound.bytesReceived || 0;

          lastStatsTime =
            now;


          const width =
            inbound.frameWidth ||
            video.videoWidth ||
            0;


          const height =
            inbound.frameHeight ||
            video.videoHeight ||
            0;


          const fps =
            inbound.framesPerSecond ||
            0;


          const lost =
            inbound.packetsLost ||
            0;


          quality.textContent =
            width +
            "×" +
            height +
            " · " +
            fps.toFixed(0) +
            " FPS · " +
            bitrate.toFixed(1) +
            " Mbps · perdidos " +
            lost;


        }catch(e){}

      },
      2000
    );

}


/* =========================================================
   DETENER ESTADÍSTICAS
========================================================= */

function stopStats(){

  if(statsTimer){

    clearInterval(
      statsTimer
    );

    statsTimer = null;

  }


  lastBytesReceived = 0;

  lastStatsTime = 0;

}


/* =========================================================
   DETENER PEER
========================================================= */

function stopConnection(){

  stopStats();

  if(talkbackStream){

    talkbackStream
      .getTracks()
      .forEach(function(track){
        try{track.stop();}catch(e){}
      });

    talkbackStream = null;

  }

  talkbackAudio.srcObject = null;
  talkbackAudio.muted = false;


  if(activeCall){

    try{
      activeCall.close();
    }catch(e){}

    activeCall = null;

  }


  if(peer){

    try{
      peer.destroy();
    }catch(e){}

    peer = null;

  }

}


/* =========================================================
   APAGAR TODO
========================================================= */

function stopAll(){

  stopConnection();


  if(stream){

    stream.getTracks().forEach(
      function(track){

        try{
          track.stop();
        }catch(e){}

      }
    );

    stream = null;

  }


  video.srcObject =
    null;


  quality.textContent = "";

  errorBox.textContent = "";


  setState(
    "Apagado"
  );


  showPlaceholder(
    "Monitor de habitación",
    "Selecciona Modo cámara o Modo visor."
  );

}
